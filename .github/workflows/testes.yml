name: Testes

on:
  push:
    branches: [main, Bernardo, Christian, clara]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    # Windows: os 4 PCs rodam Windows e o robô usa pywin32 (Outlook)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Conferir sintaxe de todo o Python
        run: python -m compileall -q src testes ferramentas robo.py

      - name: Conferir erros com o ruff (nome indefinido, import sem uso; ver ruff.toml)
        run: python -m ruff check --output-format github .

      - name: Segurança do código (bandit: só problema médio ou grave; os casos conhecidos estão justificados no próprio código)
        run: python -m bandit -r src -ll -q

      - name: Falhas conhecidas nas bibliotecas (pip-audit): falha o teste se alguma tiver correção publicada
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --disable-pip --no-deps --progress-spinner off

      - name: Rodar os testes (inclui a trava contra vazamento de credenciais)
        run: python -m pytest -q -p no:cacheprovider
