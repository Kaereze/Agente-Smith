# Avisa (abre um pedido de atualização) quando sai versão nova de uma biblioteca ou das actions do GitHub.
# Nada entra sozinho: o Claude revisa e o João aprova (Fase 1 do plano, 05/11/2026).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencias"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencias"]
