<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Notas Fiscais</title>
<link rel="icon" type="image/png" href="/icone.png">
<style>
:root{
  --fundo:#0f2e2a; --painel:#163d38; --card:#1c4842; --card2:#225249; --linha:#2d5b53;
  --texto:#efe4d4; --suave:#b9a98f; --creme:#d5bda1; --verde:#00786c; --verde2:#00a28f;
  --amarelo:#e0b84f; --laranja:#d9853b; --azul:#5b9bd5; --vermelho:#d9534f; --ok:#3fb27f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:14px "Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;background:var(--card2);color:var(--texto)}
button:hover{filter:brightness(1.15)}
button.prim{background:var(--verde);color:#fff}
button.creme{background:var(--creme);color:#173f39;font-weight:600}
button.perigo{background:#5a2b2b}
button:disabled{opacity:.45;cursor:default;filter:none}
input,textarea,select{font:inherit;color:var(--texto);background:var(--card);border:1px solid var(--linha);border-radius:8px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--verde2)}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--painel);border-bottom:1px solid var(--linha)}
.vista{min-height:0;overflow:hidden}
.vista.oculta{display:none!important}
#v-fila{display:grid;grid-template-columns:240px 1fr}
.abas{display:flex;gap:4px;margin-left:10px}
.abas button{background:transparent;color:var(--suave);padding:8px 14px;border-radius:8px}
.abas button.sel{background:var(--card);color:var(--texto);font-weight:600}
/* Visão geral / Hotéis */
.rolagem{height:100%;overflow-y:auto;padding:18px 22px 40px}
.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filtros .titulo{font-size:18px;font-weight:700;margin-right:auto}
.seg{display:inline-flex;background:var(--card);border-radius:8px;padding:3px}
.seg button{background:transparent;padding:6px 12px;font-size:13px;color:var(--suave)}
.seg button.sel{background:var(--verde);color:#fff}
.filtros input[type=date]{padding:5px 8px;font-size:13px;color-scheme:dark}
.saude{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.saude .c{background:var(--card);border-radius:10px;padding:10px 12px;border-left:4px solid var(--linha)}
.saude .c b{display:block;font-size:13px;margin-bottom:3px}
.saude .c span{font-size:12px;color:var(--suave);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saude .c .motivo{color:#fab219;white-space:normal;margin-top:3px}
.saude .bom{border-left-color:#0ca30c} .saude .alerta{border-left-color:#fab219} .saude .ruim{border-left-color:#d03b3b}
.kpis{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;padding:14px 16px}
.kpi .r{font-size:12px;color:var(--suave)}
.kpi .v{font-size:28px;font-weight:650;margin-top:4px}
.kpi .s{font-size:12px;color:var(--suave);margin-top:2px}
.kpi.hero{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
.kpi.hero .v{font-size:56px;line-height:1}
.cartao{background:#0f2e2a;border:1px solid var(--linha);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.cartao h3{margin:0;font-size:14px}
.cartao .sub{font-size:12px;color:var(--suave);margin:2px 0 10px}
.cartao-topo{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cartao-topo > div:first-child{margin-right:auto}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.viz-leg{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--suave)}
.viz-chave{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.viz-dica{position:absolute;display:none;pointer-events:none;background:#163d38;border:1px solid var(--linha);border-radius:8px;padding:8px 10px;font-size:12px;min-width:160px;box-shadow:0 6px 18px #0006;z-index:3}
.viz-dica div{margin-top:3px}
.viz-nota{color:var(--creme);font-size:11px;max-width:240px}
.link{background:none;padding:0;color:var(--creme);text-decoration:underline;font-size:12px}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;font-size:11px;font-weight:600;color:var(--suave);padding:8px;border-bottom:1px solid var(--linha);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:#0f2e2a}
.tabela th.num,.tabela td.num{text-align:right;font-variant-numeric:tabular-nums}
.tabela td{padding:7px 8px;border-bottom:1px solid #1d3d38}
.tabela tbody tr{cursor:pointer}
.tabela tbody tr:hover{background:var(--card)}
.tabela .zero{color:#5f7a73}
.alerta-txt{color:#fab219} .ruim-txt{color:#ff8a80}
.avisos{font-size:12px;color:var(--suave);margin-top:-6px;margin-bottom:12px}
/* Envio de NF (estilo Outlook) */
.modal.compor{width:min(920px,95vw);max-height:92vh}
.compor-topo{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--verde);color:#fff;font-size:13px;font-weight:600}
.compor-topo .compor-quem{flex:1;font-weight:400;opacity:.85}
.compor-topo .fechar{color:#fff}
.compor-corpo{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.compor-cab{display:flex;gap:14px;align-items:stretch}
.btn-enviar{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;background:var(--verde2);color:#fff;font-weight:700;font-size:13px}
.btn-enviar .ic{font-size:22px}
.btn-enviar:disabled{background:var(--card);color:var(--suave);cursor:not-allowed}
.campos-cab{flex:1;display:flex;flex-direction:column}
.linha-cab{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha);min-height:38px}
.linha-cab .rot{width:62px;flex:none;font-size:12px;color:var(--suave)}
.linha-cab input{flex:1;background:transparent;border:0;border-radius:0;padding:8px 2px;color:var(--texto)}
.linha-cab input:focus{outline:none;background:#ffffff08}
.campo-txt{font-size:13px;padding:8px 2px}
.campo-txt.alerta{color:#f6e3a3}
.soltar{border:2px dashed var(--linha);border-radius:12px;padding:12px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.soltar:hover,.soltar.sobre{border-color:var(--creme);background:#d5bda112}
.soltar.tem{border-style:solid}
.soltar-txt{font-size:13px;color:var(--suave);text-align:center}
.soltar.tem .soltar-txt{font-size:11px}
.chips-anexo{display:flex;flex-wrap:wrap;gap:8px}
.chips-anexo:not(:empty){margin-top:8px}
.chip-anexo{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:8px;background:var(--card2);font-size:12px;cursor:default}
.chip-anexo .x{background:transparent;padding:0 6px;font-size:15px;color:var(--suave)}
.chip-anexo .x:hover{color:#ff8a80}
.sug-linha{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sug{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px dashed var(--linha)}
.sug.forte{border:1px solid var(--creme)}
.editor{min-height:190px;background:#fff;color:#1b1b1b;border-radius:8px 8px 0 0;padding:14px 16px;font:14.5px/1.45 Calibri,"Segoe UI",sans-serif;white-space:pre-wrap;outline:none}
.editor:focus{box-shadow:inset 0 0 0 2px var(--verde2)}
.editor.curto{min-height:56px}
.editor:empty::before{content:attr(data-dica);color:#8a8a8a;font-style:italic}
.compor-corpo>*{flex:none}
.assinatura{width:100%;height:120px;border:0;background:#fff;border-radius:0 0 8px 8px;margin-top:-10px;padding:0 16px 10px;box-sizing:border-box}
.compor-rodape{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--linha);min-height:44px}
.compor-rodape .res{font-size:13px;font-weight:600}
/* Seletor de operador */
.op{position:relative}
.op-btn{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid transparent;border-radius:24px;padding:4px 12px 4px 4px;transition:border-color .2s,background .2s}
.op-btn:hover{border-color:var(--linha);filter:none;background:var(--card2)}
.op.aberto .op-btn{border-color:var(--creme)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;box-shadow:0 0 0 2px #0f2e2a}
.op-nome{font-weight:600;font-size:13px}
.op-seta{color:var(--suave);transition:transform .25s cubic-bezier(.3,1.4,.6,1)}
.op.aberto .op-seta{transform:rotate(180deg);color:var(--creme)}
.op-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:6px;
  box-shadow:0 18px 40px #0009;z-index:30;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .2s cubic-bezier(.2,.9,.3,1.2)}
.op.aberto .op-menu{opacity:1;transform:none;pointer-events:auto}
.op-menu .rot{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--suave);padding:6px 10px 4px}
.op-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;padding:8px 10px;border-radius:10px;text-align:left;opacity:0;transform:translateX(6px)}
.op.aberto .op-item{animation:opEntra .22s ease forwards}
.op-item:hover{background:var(--card);filter:none}
.op-item.sel{background:#1f4b44}
.op-item .n{flex:1;font-size:13px}
.op-item .s{font-size:11px;color:var(--suave)}
.op-item .ok{color:var(--creme);font-weight:700;opacity:0;transform:scale(.4);transition:all .2s}
.op-item.sel .ok{opacity:1;transform:none}
@keyframes opEntra{to{opacity:1;transform:none}}
/* Janela de envio */
.modal-fundo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20;animation:aparecer .15s}
.modal{width:min(720px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--painel);border:1px solid var(--linha);border-radius:16px;box-shadow:0 20px 60px #000a;overflow:hidden}
.modal-topo{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--linha)}
.modal-topo h3{margin:0;font-size:16px}
.modal-topo .sub{font-size:12px;color:var(--suave);margin-top:2px}
.anel{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid #2d5b53;border-top-color:var(--creme);animation:girar .8s linear infinite}
.anel.ok{animation:none;border-color:#0ca30c;display:grid;place-items:center;color:#0ca30c;font-weight:700}
.anel.ruim{animation:none;border-color:#d03b3b;display:grid;place-items:center;color:#ff8a80;font-weight:700}
.barra-prog{height:3px;background:#1f3f3a;overflow:hidden}
.barra-prog i{display:block;height:100%;width:30%;background:var(--creme);animation:correr 1.2s ease-in-out infinite}
.barra-prog.fim i{width:100%;animation:none;background:#0ca30c}
.trilha{flex:1;overflow-y:auto;padding:12px 20px;font-size:13px;min-height:220px}
.passo{display:grid;grid-template-columns:18px 64px 1fr;gap:8px;align-items:start;padding:5px 0;border-bottom:1px solid #1d3d38;animation:entrar .25s ease both}
.passo .m{color:#0ca30c;text-align:center}
.passo .h{color:var(--suave);font-variant-numeric:tabular-nums;font-size:12px}
.passo.atual .m::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--creme);animation:pulsar 1s ease-in-out infinite}
.passo.aviso .t{color:#fab219} .passo.erro .t{color:#ff8a80}
.modal-rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--linha)}
.modal-rodape .res{font-size:13px;font-weight:600}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes correr{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@keyframes entrar{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulsar{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
#v-hoteis{display:grid;grid-template-columns:1fr 0;transition:grid-template-columns .2s}
#v-hoteis.ficha-aberta{grid-template-columns:1fr 480px}
.marca{font-weight:700;font-size:16px;letter-spacing:.3px}
.marca span{color:var(--creme)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--card);font-size:12px;color:var(--suave)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--suave)}
.dot.on{background:var(--ok)} .dot.off{background:var(--vermelho)} .dot.warn{background:var(--amarelo)}
.esp{flex:1}
.agente{cursor:pointer}
aside{background:var(--painel);border-right:1px solid var(--linha);padding:14px 10px;overflow-y:auto}
aside h4{margin:14px 8px 6px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--suave)}
.grupo{margin-bottom:6px}
.g-tit{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;padding:10px 10px 6px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--suave);border-radius:6px}
.g-tit:hover{color:var(--texto);filter:none}
.g-seta{transition:transform .2s;font-size:12px}
.grupo.fechado .g-seta{transform:rotate(-90deg)}
.g-corpo{overflow:hidden;animation:abrirGrupo .18s ease}
.grupo.fechado .g-corpo{display:none}
@keyframes abrirGrupo{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px 6px}
.chip{background:var(--card);color:var(--suave);font-size:12px;padding:5px 10px;border-radius:14px;display:inline-flex;align-items:center;gap:5px}
.chip:hover{color:var(--texto);filter:none;background:var(--card2)}
.chip.sel{background:var(--verde);color:#fff}
.chip .n{font-size:11px;opacity:.75}
.busca-lat{width:calc(100% - 16px);margin:2px 8px 6px;padding:6px 10px;font-size:12px}
.filtro.vazio-n{opacity:.45}
.hotel-atual{border:1px solid var(--linha)}
.hotel-atual .seta{display:inline-block;margin-left:6px;transition:transform .2s}
.hotel-atual.aberta .seta{transform:rotate(180deg)}
.hotel-lista{display:none;margin-top:6px;animation:abrirGrupo .18s ease}
.hotel-lista.aberta{display:block}
.filtro{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--texto)}
.filtro:hover{background:var(--card)}
.filtro.sel{background:var(--verde);color:#fff}
.filtro .n{font-size:12px;opacity:.8}
main{display:grid;grid-template-columns:1fr 0;overflow:hidden;transition:grid-template-columns .2s}
main.detalhe-aberto{grid-template-columns:1fr 440px}
.lista-wrap{display:flex;flex-direction:column;overflow:hidden;padding:14px 18px}
.barra{display:flex;gap:10px;margin-bottom:12px}
.barra input{flex:1}
.lista{overflow-y:auto;flex:1;padding-right:4px}
.item{display:grid;grid-template-columns:92px 1fr 150px 130px;gap:12px;align-items:center;padding:10px 12px;margin-bottom:6px;background:var(--card);border-radius:10px;cursor:pointer;border-left:4px solid transparent}
.item:hover{background:var(--card2)}
.item.sel{outline:1px solid var(--creme)}
.item .data{font-size:12px;color:var(--suave)}
.item .nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .hotel{font-size:12px;color:var(--suave)}
.item .dono{font-size:12px;color:var(--creme);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.s-aguardando_envio{background:#3b4a47;color:var(--suave)} .b-aguardando_envio{border-left-color:#5f6f6b}
.s-na_fila{background:var(--amarelo);color:#2b2205} .b-na_fila{border-left-color:var(--amarelo)}
.s-em_tratamento{background:var(--azul);color:#06192b} .b-em_tratamento{border-left-color:var(--azul)}
.s-tratativa{background:var(--laranja);color:#2a1503} .b-tratativa{border-left-color:var(--laranja)}
.s-nf_parcial{background:#8f7bd1;color:#160d33} .b-nf_parcial{border-left-color:#8f7bd1}
.s-concluida{background:var(--ok);color:#06231a} .b-concluida{border-left-color:var(--ok)}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;background:#244f6e;color:#cfe6ff}
.tag.nf-ok{background:#1d5a3c;color:#c8f3d8}
.tag.nf-parc{background:#4d4214;color:#f6e3a3}
.vazio{padding:40px;text-align:center;color:var(--suave)}
.detalhe{background:var(--painel);border-left:1px solid var(--linha);overflow-y:auto;padding:18px}
.detalhe h2{margin:0 0 2px;font-size:18px}
.detalhe .sub{color:var(--suave);font-size:12px;margin-bottom:12px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bloco{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.bloco h5{margin:0 0 8px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--suave)}
.campos{width:100%;border-collapse:collapse;font-size:13px}
.campos td{padding:5px 6px;border-top:1px solid var(--linha);vertical-align:top}
.campos td:first-child{color:var(--suave);width:42%}
.linha-form{display:flex;gap:8px;margin-top:8px}
.linha-form input{flex:1}
textarea{width:100%;min-height:54px;resize:vertical}
.hist{font-size:12px;color:var(--suave)}
.hist div{padding:4px 0;border-top:1px solid var(--linha)}
.hist b{color:var(--texto);font-weight:600}
.fechar{float:right;background:transparent;font-size:18px;padding:0 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--creme);color:#173f39;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px #0007;display:none;z-index:9}
.toast.erro{background:var(--vermelho);color:#fff}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--linha);border-radius:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/icone.png" alt="" width="30" height="30"><div class="marca">Painel <span>Notas Fiscais</span></div>
    <nav class="abas" id="abas">
      <button data-vista="visao" class="sel">Visão geral</button>
      <button data-vista="fila">Solicitações</button>
      <button data-vista="hoteis">Hotéis</button>
    </nav>
    <span class="pill" id="sync"><span class="dot" id="sync-dot"></span><span id="sync-txt">conectando…</span></span>
    <span class="pill" id="robo"><span class="dot" id="robo-dot"></span><span id="robo-txt">robô</span></span>
    <div class="esp"></div>
    <button class="creme" id="btn-enviar" title="Pede ao robô (PC principal) pra enviar as solicitações pendentes">Enviar pendentes</button>
    <button id="btn-atualizar" title="Reler a planilha agora">⟳</button>
    <div class="op" id="op">
      <button class="op-btn" id="op-btn" aria-haspopup="listbox" aria-expanded="false" title="Operador deste PC (aparece pros outros nas ações)">
        <span class="av" id="op-av">?</span><span class="op-nome" id="op-nome">…</span>
        <svg class="op-seta" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="op-menu" id="op-menu" role="listbox"></div>
    </div>
  </header>
  <section class="vista" id="v-visao"><div class="rolagem" id="visao"></div></section>
  <section class="vista oculta" id="v-hoteis">
    <div class="rolagem" id="hoteis"></div>
    <div class="detalhe" id="ficha-hotel"></div>
  </section>
  <section class="vista oculta" id="v-fila">
  <aside>
    <div class="grupo" data-g="situacao"><button class="g-tit">Situação<span class="g-seta">▾</span></button>
      <div class="g-corpo" id="f-situacao"></div></div>
    <div class="grupo" data-g="envio"><button class="g-tit">E-mail ao hotel<span class="g-seta">▾</span></button>
      <div class="g-corpo"><div class="chips" id="f-envio"></div></div></div>
    <div class="grupo" data-g="periodo"><button class="g-tit">Período<span class="g-seta">▾</span></button>
      <div class="g-corpo"><div class="chips" id="f-periodo"></div><input type="hidden" id="dias" value="45"></div></div>
    <div class="grupo" data-g="hoteis"><button class="g-tit">Hotéis<span class="g-seta">▾</span></button>
      <div class="g-corpo"><div id="f-hotel-atual"></div>
        <div class="hotel-lista" id="hotel-lista"><input class="busca-lat" id="busca-hotel-fila" placeholder="Buscar hotel…"><div id="f-hotel"></div></div></div></div>
  </aside>
  <main id="main">
    <div class="lista-wrap">
      <div class="barra"><input id="busca" placeholder="Buscar por nome, e-mail, CPF/CNPJ, hotel…"></div>
      <div class="lista" id="lista"></div>
    </div>
    <div class="detalhe" id="detalhe"></div>
  </main>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
const NOMES = {aguardando_envio:"Aguardando envio", na_fila:"Na fila", em_tratamento:"Em tratamento",
               tratativa:"Tratativa", nf_parcial:"NF parcial", concluida:"NF emitida"};
const ORDEM_FILTROS = ["todas","minhas","na_fila","em_tratamento","tratativa","nf_parcial","aguardando_envio","concluida"];
let st = {fila:[], agente:"", status:{}}, filtro = "na_fila", hotel = "", envio = "todos", listaHoteis = false, sel = null, timer = null, intervalo = 15;
const ENVIO = {todos: ["Todos", () => true], sim: ["Enviado", s => s.enviado], nao: ["Não enviado", s => !s.enviado]};
const PERIODOS_FILA = [["7", "7 dias"], ["15", "15 dias"], ["45", "45 dias"], ["90", "90 dias"], ["0", "Tudo"]];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataBr = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
const quando = iso => { if(!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };

async function api(path, corpo){
  const r = await fetch(path, {method: corpo ? "POST" : "GET", headers:{"X-Token":TOKEN,"Content-Type":"application/json"},
                               body: corpo ? JSON.stringify(corpo) : undefined});
  const j = await r.json().catch(() => ({ok:false, motivo:"resposta inválida"}));
  if (!r.ok && j.ok === undefined) j.ok = false;
  return j;
}
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast" + (erro ? " erro" : ""); t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", erro ? 5000 : 2500); }

async function carregar(){
  try {
    const j = await api("/api/estado?dias=" + $("dias").value);
    if (j.erro === "não autorizado") { location.reload(); return; }   // servidor reiniciado (atualização): pega a sessão nova
    st = j; intervalo = j.atualizar_segundos || 15;
    desenharOperador(j.agente, j.operadores || []);
    if (!j.atualizado_em && !j.erro) {   // primeira leitura da planilha ainda em andamento
      $("sync-txt").textContent = "lendo a planilha…"; $("lista").innerHTML = `<div class="vazio">Carregando solicitações…</div>`;
      clearTimeout(timer); timer = setTimeout(carregar, 2000); return;
    }
    const ok = !j.erro;
    $("sync-dot").className = "dot " + (ok ? "on" : "off");
    $("sync-txt").textContent = ok ? "sincronizado " + quando(j.atualizado_em) : "sem conexão com a planilha";
    const s = j.status || {};
    $("robo-dot").className = "dot " + (s.ligado ? "on" : "off");
    $("robo-txt").textContent = "robô " + (s.ligado ? "ligado" : "desligado") + (s.comando ? " · " + s.comando.toLowerCase() : "");
    $("robo").title = (s.resumo || "") + (s.resposta ? "\n" + s.resposta : "");
    desenhar();
  } catch(e) {
    $("sync-dot").className = "dot off"; $("sync-txt").textContent = "app desconectado";
  }
  clearTimeout(timer); timer = setTimeout(carregar, intervalo * 1000);
}

function passa(s, f){
  if (f === "todas") return true;
  if (f === "minhas") return s.dono === st.agente && s.situacao !== "concluida";
  return s.situacao === f;
}
function texto(s){ return (s.nome+" "+s.email+" "+s.hotel+" "+s.carimbo+" "+s.nfs.join(" ")+" "+s.campos.map(c=>c[1]).join(" ")).toLowerCase(); }

// Nota dividida: quantas das partes já têm NF ("Dividida em quantas vezes"; sem número = 2)
function tagDivisao(s) {
  const partes = Math.max(s.partes || 1, 2), feitas = s.nfs.length, falta = partes - feitas;
  if (!feitas) return "";
  return feitas >= partes ? `<span class="tag nf-ok" title="NF ${esc(s.nfs.join(", "))}">NF emitida</span>`
    : `<span class="tag nf-parc" title="NF ${esc(s.nfs.join(", "))} · ${feitas} de ${partes}">falta ${falta} nota${falta > 1 ? "s" : ""}</span>`;
}
// O hóspede pediu dividida e depois aceitou uma nota só: a frase dele fica no título
const tagNotaUnica = s => s.nota_unica ? `<span class="tag nf-ok" title="${esc(s.nota_unica)}">1 nota a pedido do hóspede</span>` : "";

function desenhar(){
  const busca = $("busca").value.trim().toLowerCase();
  // contagem do "E-mail ao hotel" respeita hotel e situação; os outros grupos respeitam o filtro de e-mail
  const semEnvio = st.fila.filter(s => (!hotel || s.hotel === hotel) && passa(s, filtro));
  $("f-envio").innerHTML = Object.entries(ENVIO).map(([k, [nome, ok]]) =>
    `<button class="chip ${k===envio?"sel":""}" data-e="${k}">${nome}<span class="n">${semEnvio.filter(ok).length}</span></button>`).join("");
  $("f-periodo").innerHTML = PERIODOS_FILA.map(([v, nome]) =>
    `<button class="chip ${v===$("dias").value?"sel":""}" data-dias="${v}">${nome}</button>`).join("");
  const fila = st.fila.filter(ENVIO[envio][1]);
  const porHotel = hotel ? fila.filter(s => s.hotel === hotel) : fila;
  // Situação: some o que está zerado (o selecionado fica sempre)
  $("f-situacao").innerHTML = ORDEM_FILTROS.map(f => {
    const n = porHotel.filter(s => passa(s, f)).length;
    if (!n && f !== filtro && f !== "todas") return "";
    const nome = f === "todas" ? "Todas" : f === "minhas" ? "Minhas" : NOMES[f];
    return `<div class="filtro ${f===filtro?"sel":""} ${n?"":"vazio-n"}" data-f="${f}"><span>${nome}</span><span class="n">${n}</span></div>`;
  }).join("");
  // Hotéis: mais pendências primeiro, com busca
  const hoteis = {}, buscaHotel = $("busca-hotel-fila").value.trim().toLowerCase();
  fila.filter(s => passa(s, filtro)).forEach(s => hoteis[s.hotel] = (hoteis[s.hotel]||0) + 1);
  const nomesHotel = Object.keys(hoteis).filter(h => !buscaHotel || h.toLowerCase().includes(buscaHotel))
    .sort((a, b) => hoteis[b] - hoteis[a] || a.localeCompare(b));
  // Fechado: só o hotel escolhido; clicando nele abre a busca e a lista embaixo
  const total = Object.values(hoteis).reduce((a, b) => a + b, 0);
  $("f-hotel-atual").innerHTML = `<div class="filtro sel hotel-atual ${listaHoteis ? "aberta" : ""}" data-hlista="1">
    <span>${esc(hotel || "Todos os hotéis")}</span><span class="n">${hotel ? (hoteis[hotel] || 0) : total}<span class="seta">▾</span></span></div>`;
  $("hotel-lista").classList.toggle("aberta", listaHoteis);
  $("f-hotel").innerHTML = (buscaHotel || !hotel ? "" : `<div class="filtro" data-h=""><span>Todos os hotéis</span><span class="n">${total}</span></div>`) +
    nomesHotel.filter(h => h !== hotel).map(h => `<div class="filtro" data-h="${esc(h)}"><span>${esc(h)}</span><span class="n">${hoteis[h]||0}</span></div>`).join("") +
    (buscaHotel && !nomesHotel.length ? `<div class="hist" style="padding:6px 10px">Nenhum hotel com esse nome</div>` : "");

  let lista = porHotel.filter(s => passa(s, filtro));
  if (busca) lista = lista.filter(s => texto(s).includes(busca));
  $("lista").innerHTML = lista.length ? lista.slice(0, 600).map(s => `
    <div class="item b-${s.situacao} ${sel===s.chave?"sel":""}" data-k="${esc(s.chave)}">
      <div class="data">${dataBr(s.data)}<br>linha ${s.linha}</div>
      <div><div class="nome">${esc(s.nome)}${s.dividida?'<span class="tag">dividida</span>' + tagDivisao(s):tagNotaUnica(s)}</div><div class="hotel">${esc(s.hotel)} · ${esc(s.email)}</div></div>
      <div class="dono">${s.dono ? "👤 " + esc(s.dono) : ""}${s.nfs.length ? "<br>NF " + esc(s.nfs.join(", ")) : ""}</div>
      <div style="text-align:right"><span class="badge s-${s.situacao}">${NOMES[s.situacao]}</span></div>
    </div>`).join("") : `<div class="vazio">Nada aqui. 🎉</div>`;
  desenharDetalhe();
}

function desenharDetalhe(){
  const s = st.fila.find(x => x.chave === sel);
  $("main").classList.toggle("detalhe-aberto", !!s);
  if (!s) { $("detalhe").innerHTML = ""; return; }
  const meu = s.dono === st.agente, livre = !s.dono;
  $("detalhe").innerHTML = `
    <button class="fechar" id="d-fechar">×</button>
    <h2>${esc(s.nome)}</h2>
    <div class="sub">${esc(s.hotel)} · linha ${s.linha} · pedido em ${esc(s.carimbo)}<br>
      ${s.enviado ? "✉ E-mail já enviado ao hotel" : "✉ E-mail ainda não enviado ao hotel"}</div>
    <span class="badge s-${s.situacao}">${NOMES[s.situacao]}</span>
    ${s.dono ? `<span class="pill" style="margin-left:6px">👤 ${esc(s.dono)} desde ${quando(s.dono_desde)}</span>` : ""}
    <div class="acoes">
      ${livre ? `<button class="prim" data-a="ASSUMIR">Assumir</button>` : ""}
      ${meu ? `<button data-a="LIBERAR">Liberar</button>` : ""}
      ${!livre && !meu ? `<button class="perigo" data-a="LIBERAR" data-v="forcar" title="Tira de ${esc(s.dono)}">Liberar à força</button>` : ""}
      <button data-copiar="1">Copiar dados</button>
      <button data-a="DIVIDIDA" data-v="${s.dividida ? "nao" : "sim"}">${s.dividida ? "Não é dividida" : "Nota dividida"}</button>
    </div>
    <div class="bloco"><h5>Nota fiscal ${s.partes > 1 || s.dividida ? `(dividida em ${Math.max(s.partes, 2)})` : ""}</h5>
      ${s.nfs.length ? s.nfs.map(n => `<span class="badge s-concluida" style="margin:0 6px 6px 0">NF ${esc(n)}${s.nfs_conferente.includes(n) ? " · conferente" : ""}
        ${s.nfs_conferente.includes(n) ? "" : `<a href="#" data-desfaz="${esc(n)}" style="color:#06231a;margin-left:4px">×</a>`}</span>`).join("") : `<div class="hist">Nenhuma NF ainda.</div>`}
      <div class="linha-form"><input id="d-nf" placeholder="Número da NF emitida"><button class="prim" id="d-nf-ok">Marcar NF</button></div>
    </div>
    <div class="bloco"><h5>Enviar NF ao hóspede</h5>
      <div class="hist" style="margin-bottom:8px">Anexe a nota e envie por e-mail, saindo da caixa do hotel.</div>
      <button class="prim" data-envnf="${esc(s.chave)}">✉ Enviar NF por e-mail</button>
    </div>
    <div class="bloco"><h5>Tratativa / observação</h5>
      <textarea id="d-txt" placeholder="Ex.: pedi o CNPJ correto por e-mail"></textarea>
      <div class="linha-form" style="justify-content:flex-end"><button data-txt="OBS">Anotar</button><button class="creme" data-txt="TRATATIVA">Registrar tratativa</button></div>
    </div>
    <div class="bloco"><h5>Dados do formulário</h5>
      <table class="campos"><tr><td>E-mail do hóspede</td><td>${esc(s.email)}</td></tr>${s.campos.map(c => `<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join("")}</table>
    </div>
    <div class="bloco"><h5>Histórico</h5><div class="hist">${s.historico.length ? s.historico.slice().reverse().map(h =>
      `<div><b>${esc(h.agente)}</b> · ${esc(rotulo(h))} <span style="float:right">${quando(h.quando)}</span></div>`).join("") : "Sem ações ainda."}</div></div>`;
}
function rotulo(h){
  const m = {ASSUMIR:"assumiu", LIBERAR: h.valor === "forcar" ? "liberou à força" : "liberou", NF:"marcou NF " + h.valor,
             DESFAZER_NF:"desfez NF " + h.valor, TRATATIVA:"tratativa: " + h.valor, OBS:"anotou: " + h.valor,
             DIVIDIDA: h.valor === "sim" ? "marcou nota dividida" : "tirou nota dividida"};
  return m[h.acao] || h.acao;
}

async function acao(a, valor){
  const s = st.fila.find(x => x.chave === sel); if (!s) return;
  document.querySelectorAll("#detalhe button").forEach(b => b.disabled = true);
  const r = await api("/api/acao", {chave: s.chave, acao: a, valor: valor || ""});
  if (r.ok) toast("Feito ✔"); else toast(r.motivo || "Não deu certo", true);
  await carregar();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-f],[data-e],[data-dias],[data-hlista],[data-h],[data-k],[data-a],[data-txt],[data-desfaz],[data-copiar],#d-fechar,#d-nf-ok");
  if (!t) return;
  if (t.dataset.f) { filtro = t.dataset.f; return desenhar(); }
  if (t.dataset.e) { envio = t.dataset.e; return desenhar(); }
  if (t.dataset.dias) { $("dias").value = t.dataset.dias; desenhar(); return carregar(); }
  if (t.dataset.hlista) {
    listaHoteis = !listaHoteis; desenhar();
    if (listaHoteis) $("busca-hotel-fila").focus();
    return;
  }
  if (t.dataset.h !== undefined && t.classList.contains("filtro")) {
    hotel = t.dataset.h; listaHoteis = false; $("busca-hotel-fila").value = ""; return desenhar();
  }
  if (t.dataset.k) { sel = t.dataset.k; return desenhar(); }
  if (t.id === "d-fechar") { sel = null; return desenhar(); }
  if (t.dataset.a) {
    if (t.dataset.v === "forcar" && !confirm("Tirar esta solicitação de quem está tratando?")) return;
    return acao(t.dataset.a, t.dataset.v);
  }
  if (t.id === "d-nf-ok") { const n = $("d-nf").value.trim().replace(/\D/g, ""); if (!n) return toast("Digite o número da NF", true); return acao("NF", n); }
  if (t.dataset.desfaz) { e.preventDefault(); if (confirm("Desfazer a NF " + t.dataset.desfaz + "?")) return acao("DESFAZER_NF", t.dataset.desfaz); return; }
  if (t.dataset.txt) { const v = $("d-txt").value.trim(); if (!v) return toast("Escreva o texto primeiro", true); return acao(t.dataset.txt, v); }
  if (t.dataset.copiar) {
    const s = st.fila.find(x => x.chave === sel);
    await navigator.clipboard.writeText([`Hotel: ${s.hotel}`, `E-mail: ${s.email}`, ...s.campos.map(c => `${c[0]}: ${c[1]}`)].join("\n"));
    toast("Dados copiados");
  }
});
$("busca").addEventListener("input", desenhar);
$("busca-hotel-fila").addEventListener("input", desenhar);
// Grupos da lateral abrem/fecham; o estado fica guardado neste PC
const GRUPOS_KEY = "painel.gruposFechados";
let gruposFechados = [];
try { gruposFechados = JSON.parse(localStorage.getItem(GRUPOS_KEY) || "[]"); } catch (e) {}
document.querySelectorAll(".grupo").forEach(g => {
  g.classList.toggle("fechado", gruposFechados.includes(g.dataset.g));
  g.querySelector(".g-tit").addEventListener("click", () => {
    g.classList.toggle("fechado");
    gruposFechados = [...document.querySelectorAll(".grupo.fechado")].map(x => x.dataset.g);
    try { localStorage.setItem(GRUPOS_KEY, JSON.stringify(gruposFechados)); } catch (e) {}
  });
});
$("btn-atualizar").addEventListener("click", async () => { $("sync-txt").textContent = "atualizando…"; await api("/api/atualizar", {}); carregar(); });
$("btn-enviar").addEventListener("click", () => abrirEnvio());
// Seletor de operador: avatar com cor fixa por pessoa
const COR_OP = {"João": "#3987e5", "Cristian": "#d95926", "Clara": "#199e70", "Bernardo": "#9085e9"};
const corOp = n => COR_OP[n] || "#5f7a73";
const inicial = n => (n || "?").trim().charAt(0).toUpperCase();
let opAtual = "", opLista = [];
function desenharOperador(atual, lista) {
  if (atual === opAtual && lista.join() === opLista.join()) return;
  opAtual = atual; opLista = lista.includes(atual) ? lista : [atual, ...lista];
  $("op-nome").textContent = atual;
  $("op-av").textContent = inicial(atual);
  $("op-av").style.background = corOp(atual);
  $("op-menu").innerHTML = `<div class="rot">Quem está neste PC</div>` + opLista.map((o, i) =>
    `<button class="op-item ${o === atual ? "sel" : ""}" role="option" data-op="${esc(o)}" style="animation-delay:${i * 35}ms">
      <span class="av" style="background:${corOp(o)}">${esc(inicial(o))}</span>
      <span class="n">${esc(o)}${o === atual ? '<br><span class="s">este PC</span>' : ""}</span><span class="ok">✓</span></button>`).join("");
}
function menuOperador(abrir) {
  const op = $("op"), aberto = abrir ?? !op.classList.contains("aberto");
  op.classList.toggle("aberto", aberto);
  $("op-btn").setAttribute("aria-expanded", aberto);
  if (aberto) op.querySelectorAll(".op-item").forEach(b => { b.style.animation = "none"; b.offsetHeight; b.style.animation = ""; });
}
$("op-btn").addEventListener("click", e => { e.stopPropagation(); menuOperador(); });
$("op-menu").addEventListener("click", async e => {
  const item = e.target.closest("[data-op]");
  if (!item) return;
  e.stopPropagation();
  const nome = item.dataset.op;
  menuOperador(false);
  if (nome === opAtual) return;
  const r = await api("/api/agente", {nome});
  if (r.ok) { desenharOperador(nome, opLista); toast("Operador: " + nome); carregar(); } else toast(r.motivo, true);
});
document.addEventListener("click", e => { if (!e.target.closest("#op")) menuOperador(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") menuOperador(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { sel = null; desenhar(); } });
carregar();
</script>
<script src="/graficos.js"></script>
<script src="/painel.js"></script>
</body>
</html>
