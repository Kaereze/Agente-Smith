<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Notas Fiscais</title>
<link rel="icon" type="image/png" href="/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Leiaute: barra lateral verde com seções | área creme com filtros no topo | lista + leitura ao lado (estilo Outlook).
   Cores só por token: o tema claro/escuro segue o Windows. */
:root{
  --chao:#f3efe4; --folha:#fffdf8; --folha-2:#f8f4ea; --linha:#e3dccb; --linha-forte:#cbbf9f;
  --tinta:#16261f; --tinta-2:#52605a; --tinta-3:#86918a;
  --mata:#0e3a33; --mata-2:#14473f; --mata-tinta:#f1e9da; --mata-suave:#9fb8ae;
  --verde:#0d8a6a; --verde-forte:#0a6f55; --verde-suave:#e1efe8;
  --creme:#ece0c6; --creme-forte:#b8975e; --creme-tinta:#5c4720;
  --ok:#1d7d4f; --ok-fundo:#e0f1e6; --atencao:#a26a00; --atencao-fundo:#f7ebd0; --erro:#b53a2e; --erro-fundo:#f8e3de;
  --info:#2d6585; --info-fundo:#e0ebf2; --roxo:#6a4fb0; --roxo-fundo:#ebe5f7;
  --sombra:0 1px 2px rgba(14,58,51,.05),0 6px 20px rgba(14,58,51,.07);
  --f-texto:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-titulo:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --f-dado:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  /* nomes antigos, usados no painel.js */
  --texto:var(--tinta); --suave:var(--tinta-2); --card:var(--folha-2); --card2:var(--linha);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chao:#0c1a17; --folha:#112420; --folha-2:#152b26; --linha:#22413a; --linha-forte:#30564c;
  --tinta:#ede6d8; --tinta-2:#b6beb4; --tinta-3:#84918a;
  --mata:#081512; --mata-2:#0f2621; --mata-tinta:#ece2cf; --mata-suave:#8ea69c;
  --verde:#36b08f; --verde-forte:#2b9377; --verde-suave:#173a32;
  --creme:#3a3122; --creme-forte:#d4b67e; --creme-tinta:#efdcb6;
  --ok:#5fc48c; --ok-fundo:#16372a; --atencao:#e5b45c; --atencao-fundo:#3a2f17; --erro:#ef8b7f; --erro-fundo:#3e1e1a;
  --info:#90c4e1; --info-fundo:#17303d; --roxo:#b9a6f0; --roxo-fundo:#2a2440;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --chao:#0c1a17; --folha:#112420; --folha-2:#152b26; --linha:#22413a; --linha-forte:#30564c;
  --tinta:#ede6d8; --tinta-2:#b6beb4; --tinta-3:#84918a;
  --mata:#081512; --mata-2:#0f2621; --mata-tinta:#ece2cf; --mata-suave:#8ea69c;
  --verde:#36b08f; --verde-forte:#2b9377; --verde-suave:#173a32;
  --creme:#3a3122; --creme-forte:#d4b67e; --creme-tinta:#efdcb6;
  --ok:#5fc48c; --ok-fundo:#16372a; --atencao:#e5b45c; --atencao-fundo:#3a2f17; --erro:#ef8b7f; --erro-fundo:#3e1e1a;
  --info:#90c4e1; --info-fundo:#17303d; --roxo:#b9a6f0; --roxo-fundo:#2a2440;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--chao);color:var(--tinta);font:14px/1.45 var(--f-texto)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--linha-forte);background:var(--folha);border-radius:9px;padding:8px 13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
button:hover{border-color:var(--verde)}
button.prim{background:var(--verde);border-color:var(--verde);color:#fff}
button.prim:hover{background:var(--verde-forte)}
button.creme{background:var(--creme-forte);border-color:var(--creme-forte);color:var(--mata);font-weight:600}
button.perigo{border-color:var(--erro);color:var(--erro)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{background:var(--folha);border:1px solid var(--linha-forte);border-radius:9px;padding:8px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--verde)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.dado{font-family:var(--f-dado);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rot{font:600 11px/1 var(--f-titulo);letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-3)}
.dica{font-size:12px;color:var(--tinta-3)}
svg.ic{width:17px;height:17px;flex:none}
.oculta,.vista.oculta{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--linha-forte);border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100vh}
.lateral{background:var(--mata);color:var(--mata-tinta);display:flex;flex-direction:column;min-height:0;overflow:hidden;padding-block:18px 14px}
.lateral .navega{flex:1;min-height:0;overflow-y:auto}
.lateral ::-webkit-scrollbar-thumb{background:var(--mata-2)}
.marca{display:flex;align-items:center;gap:11px;padding:0 20px 18px}
.marca .selo{width:36px;height:36px;border-radius:9px;background:var(--creme-forte);color:var(--mata);display:grid;place-items:center;font:600 14px var(--f-titulo);flex:none}
.marca b{font:600 17px/1.1 var(--f-titulo);letter-spacing:.01em;display:block}
.marca small{display:block;font-size:11.5px;color:var(--mata-suave)}
.secao{padding:0 10px}
.secao + .secao{margin-top:4px}
.secao summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500;user-select:none}
.secao summary::-webkit-details-marker{display:none}
.secao summary:hover{background:rgba(255,255,255,.05)}
.secao summary .seta{margin-left:auto;width:14px;height:14px;transition:transform .2s;color:var(--mata-suave)}
.secao[open] summary .seta{transform:rotate(180deg)}
.sub{display:grid;gap:1px;padding:2px 0 6px}
.ln{border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:7px 12px 7px 39px;border-radius:8px;text-align:left;color:var(--mata-suave);font-size:13.5px;font-weight:400;width:100%}
.ln:hover{background:rgba(255,255,255,.05);color:var(--mata-tinta)}
.ln[aria-current="true"]{background:var(--mata-2);color:var(--mata-tinta);font-weight:600;box-shadow:inset 3px 0 0 var(--creme-forte)}
.ln .n{margin-left:auto;font:500 11.5px var(--f-dado);color:var(--mata-suave)}
.ln .bola{width:7px;height:7px;border-radius:50%;flex:none}
.ln.vazio-n{opacity:.5}
.lateral .rodape{padding:14px 14px 0;display:grid;gap:12px;border-top:1px solid rgba(255,255,255,.08)}
.lateral .rodape > button{justify-content:center}

.palco{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.topo{display:flex;align-items:center;gap:16px;padding:12px 26px;border-bottom:1px solid var(--linha);background:var(--folha);flex-wrap:wrap}
.trilha-nav{font-size:13px;color:var(--tinta-3);white-space:nowrap}
.trilha-nav b{color:var(--tinta);font-weight:500}
.busca{flex:1;min-width:200px;max-width:480px;position:relative;margin-left:auto}
.busca input{width:100%;background:var(--folha-2);border-color:var(--linha);padding-left:36px}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.sync{display:flex;gap:6px;font-size:12.5px;color:var(--tinta-2);flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font-size:12.5px;color:var(--tinta-2);white-space:nowrap;border:1px solid transparent}
.pill.clicavel{cursor:pointer}.pill.clicavel:hover{border-color:var(--linha)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tinta-3);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--erro)} .dot.warn{background:var(--atencao)}
.btn-ic{padding:7px 9px}

.vista{min-height:0;overflow:hidden}
.rolagem{height:100%;overflow-y:auto;padding:22px 26px 40px}

/* ---------- caixa de entrada ---------- */
#v-fila{display:grid;grid-template-rows:auto minmax(0,1fr)}
.cabecalho{padding:22px 26px 14px;display:grid;gap:16px}
h1{margin:0;font:600 26px/1.15 var(--f-titulo);letter-spacing:.005em;text-wrap:balance}
h1 .n{color:var(--tinta-3);font-weight:500}
.filtros-caixa{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.sel{position:relative;display:inline-block}
label.sel select{appearance:none;padding:9px 36px 9px 14px;font-weight:500;max-width:280px}
label.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--tinta-2);border-bottom:2px solid var(--tinta-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip-f{padding:9px 14px}
.chip-f .bola{width:8px;height:8px;border-radius:50%}
.chip-f[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-suave);color:var(--verde-forte)}
.seg{display:inline-flex;border:1px solid var(--linha-forte);border-radius:10px;padding:3px;background:var(--folha);gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 14px;color:var(--tinta-2)}
.seg button.sel,.seg button[aria-pressed="true"]{background:var(--verde);color:#fff}
.seg button .n{font:500 11px var(--f-dado);opacity:.8}
.filtros-caixa .seg{margin-left:auto}

.mesa{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-height:0;padding:0 26px 22px}
.mesa.com-leitura{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.quadro{background:var(--folha);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--sombra);min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.linhas-cab,.linha{display:grid;grid-template-columns:92px minmax(0,1.7fr) minmax(0,1fr) 74px 136px;gap:12px;align-items:center;padding:0 18px}
.mesa.com-leitura .linhas-cab,.mesa.com-leitura .linha{grid-template-columns:minmax(0,1.7fr) 70px 128px}
.mesa.com-leitura .col-tipo,.mesa.com-leitura .col-hotel{display:none}
.linhas-cab{background:var(--folha-2);border-bottom:1px solid var(--linha);min-height:44px}
.linhas-cab span{font:600 11px var(--f-titulo);letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-3)}
.linhas{overflow-y:auto}
.linha{min-height:64px;border-bottom:1px solid var(--linha);cursor:pointer;position:relative}
.linha:hover{background:var(--folha-2)}
.linha.sel{background:var(--verde-suave)}
.linha.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--verde)}
.tipo-o{font:600 11px var(--f-titulo);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;color:var(--tinta-2)}
.tipo-o i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-style:normal}
.tipo-o.form i{background:var(--creme);color:var(--creme-tinta)} .tipo-o.email i{background:var(--info-fundo);color:var(--info)}
.tipo-o svg{width:14px;height:14px}
.quem-linha{min-width:0;display:grid;gap:2px;padding-block:10px}
.quem-linha b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quem-linha small{font-size:12.5px;color:var(--tinta-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-hotel{font:500 12px var(--f-titulo);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-hotel small{display:block;text-transform:none;letter-spacing:0;font:400 12px var(--f-texto);color:var(--tinta-3)}
.hora{font:500 12px var(--f-dado);color:var(--tinta-3)}
.pilula{display:inline-block;font:600 10.5px/1 var(--f-titulo);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap}
.p-na_fila{background:var(--atencao-fundo);color:var(--atencao)} .p-concluida{background:var(--ok-fundo);color:var(--ok)}
.p-tratativa{background:var(--info-fundo);color:var(--info)} .p-nf_parcial{background:var(--creme);color:var(--creme-tinta)}
.p-sem_resposta{background:var(--erro-fundo);color:var(--erro)} .p-em_tratamento{background:var(--roxo-fundo);color:var(--roxo)}
.p-aguardando_envio{background:var(--folha-2);color:var(--tinta-2);border:1px solid var(--linha)}
.tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;font:500 10.5px var(--f-texto);background:var(--info-fundo);color:var(--info);vertical-align:1px}
.tag.nf-ok{background:var(--ok-fundo);color:var(--ok)} .tag.nf-parc{background:var(--atencao-fundo);color:var(--atencao)}
.tag.dono{background:var(--roxo-fundo);color:var(--roxo)}
.paginacao{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;border-top:1px solid var(--linha);font-size:12.5px;color:var(--tinta-3);flex-wrap:wrap}
.pags{display:flex;gap:6px}
.pags button{min-width:32px;height:32px;padding:0 9px;justify-content:center}
.pags button[aria-current="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.vazio{display:grid;place-items:center;min-height:160px;color:var(--tinta-3);text-align:center;padding:30px}

/* leitura estilo Outlook */
.leitura{background:var(--folha);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--sombra);overflow-y:auto;min-width:0;min-height:0}
.acoes{display:flex;gap:8px;padding:12px 22px;border-bottom:1px solid var(--linha);flex-wrap:wrap;background:var(--folha-2);position:sticky;top:0;z-index:2;align-items:center}
.acoes .fechar{margin-left:auto}
.fechar{border:0;background:transparent;width:32px;height:32px;padding:0;justify-content:center;border-radius:8px;font-size:20px;color:var(--tinta-3)}
.fechar:hover{background:var(--linha)}
.cab-msg{padding:20px 24px 16px;border-bottom:1px solid var(--linha);display:grid;gap:12px}
.cab-msg h2{font:600 21px/1.25 var(--f-titulo);margin:0;text-wrap:balance}
.remet{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--creme-forte);color:var(--mata);display:grid;place-items:center;font:600 13px var(--f-titulo);flex:none;grid-row:span 2}
.remet .de{color:var(--tinta-2);font-size:13px;overflow-wrap:anywhere}
.remet .quando{grid-row:span 2;text-align:right;font-size:12.5px;color:var(--tinta-3)}
.etiquetas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.etq{font-size:12px;border:1px solid var(--linha);border-radius:999px;padding:3px 9px;color:var(--tinta-2);background:var(--folha-2)}
.etq.ruim{border-color:var(--erro);color:var(--erro)}
.corpo-msg{padding:22px 24px 34px;display:grid;gap:22px;align-content:start}
.texto-email{white-space:pre-wrap;font-size:14.5px;line-height:1.6;max-width:72ch;overflow-wrap:anywhere}
.ficha{border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.ficha-tit{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--folha-2);border-bottom:1px solid var(--linha);gap:10px;flex-wrap:wrap}
.ficha-corpo{padding:14px 16px;display:grid;gap:10px}
.ficha dl{display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr);margin:0}
.ficha dt,.ficha dd{padding:9px 16px;border-bottom:1px solid var(--linha);margin:0}
.ficha dt{color:var(--tinta-3);font-size:13px}
.ficha dd{overflow-wrap:anywhere}
.ficha dl > :nth-last-child(-n+2){border-bottom:0}
.anexos{display:flex;gap:10px;flex-wrap:wrap}
.anexo{display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:9px;padding:9px 12px;background:var(--folha-2);min-width:0}
.anexo .ext{width:30px;height:36px;border-radius:4px;background:var(--erro-fundo);color:var(--erro);display:grid;place-items:center;font:600 9px var(--f-dado);flex:none}
.linha-form{display:flex;gap:8px;flex-wrap:wrap}
.linha-form input{flex:1;min-width:140px}
textarea{width:100%;min-height:64px;resize:vertical}
.nf-num{display:inline-flex;align-items:center;gap:6px;background:var(--ok-fundo);color:var(--ok);border-radius:6px;padding:4px 9px;font:600 12px var(--f-dado)}
.nf-num a{color:inherit;text-decoration:none;font-size:15px;line-height:1}
.historico{display:grid;border-left:2px solid var(--linha);margin-left:6px}
.passo-h{position:relative;padding:0 0 14px 18px;font-size:13px;color:var(--tinta-2)}
.passo-h::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--folha);border:2px solid var(--verde)}
.passo-h b{color:var(--tinta);font-weight:600}
.passo-h .dado{color:var(--tinta-3);font-size:12px;margin-right:6px}
.erro-txt,.ruim-txt{color:var(--erro)} .alerta-txt{color:var(--atencao)}

/* ---------- Visão geral / Hotéis (painel.js) ---------- */
.filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filtros .titulo{font:600 26px/1.15 var(--f-titulo);margin-right:auto}
.filtros input[type=date]{padding:6px 9px;font-size:13px}
.saude{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.saude .c{background:var(--folha);border:1px solid var(--linha);border-radius:12px;padding:11px 14px;box-shadow:inset 3px 0 0 var(--linha-forte)}
.saude .c b{display:block;font-size:13px;margin-bottom:3px}
.saude .c span{font-size:12px;color:var(--tinta-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saude .c .motivo{color:var(--atencao);white-space:normal;margin-top:3px}
.saude .bom{box-shadow:inset 3px 0 0 var(--ok)} .saude .alerta{box-shadow:inset 3px 0 0 var(--atencao)} .saude .ruim{box-shadow:inset 3px 0 0 var(--erro)}
.kpis{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--folha);border:1px solid var(--linha);border-radius:12px;padding:14px 16px}
.kpi .r{font:600 11px var(--f-titulo);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3)}
.kpi .v{font:500 28px/1.1 var(--f-dado);margin-top:8px}
.kpi .s{font-size:12px;color:var(--tinta-3);margin-top:4px}
.kpi.hero{grid-row:span 2;display:flex;flex-direction:column;justify-content:center;background:var(--mata);color:var(--mata-tinta);border-color:var(--mata)}
.kpi.hero .r,.kpi.hero .s{color:var(--mata-suave)}
.kpi.hero .v{font-size:56px;line-height:1}
.kpi.hero .link{color:var(--creme-forte)}
.cartao{background:var(--folha);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--sombra)}
.cartao h3{margin:0;font:600 16px var(--f-titulo)}
.cartao .sub{font-size:12px;color:var(--tinta-3);margin:2px 0 10px}
.cartao-topo{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cartao-topo > div:first-child{margin-right:auto}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.viz-leg{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--tinta-2)}
.viz-chave{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.viz-dica{position:absolute;display:none;pointer-events:none;background:var(--folha);border:1px solid var(--linha);border-radius:8px;padding:8px 10px;font-size:12px;min-width:160px;box-shadow:var(--sombra);z-index:3}
.viz-dica div{margin-top:3px}
.viz-nota{color:var(--creme-tinta);font-size:11px;max-width:240px}
.link{background:none;border:0;padding:0;color:var(--verde);text-decoration:underline;font-size:12px;display:inline}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;font:600 11px var(--f-titulo);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);padding:10px;border-bottom:1px solid var(--linha);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--folha-2)}
.tabela th.num,.tabela td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-dado)}
.tabela td{padding:9px 10px;border-bottom:1px solid var(--linha)}
.tabela tbody tr{cursor:pointer}
.tabela tbody tr:hover{background:var(--folha-2)}
.tabela .zero{color:var(--tinta-3)}
.avisos{font-size:12px;color:var(--tinta-3);margin-top:-6px;margin-bottom:12px}
.barra{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.barra input{flex:1}
#v-hoteis{display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .2s}
#v-hoteis.ficha-aberta{grid-template-columns:minmax(0,1fr) 500px}
.detalhe{background:var(--folha);border-left:1px solid var(--linha);overflow-y:auto;padding:20px}
.detalhe h2{margin:0 0 2px;font:600 21px var(--f-titulo)}
.detalhe .sub{color:var(--tinta-3);font-size:12px;margin-bottom:12px}
.detalhe .fechar{float:right}

/* ---------- Log e Máquinas ---------- */
.cab-pagina{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cab-pagina h1{margin-right:auto}
.contas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.conta{background:var(--folha);border:1px solid var(--linha);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.conta .v{font:500 26px/1 var(--f-dado)}
.conta .s{font-size:12px;color:var(--tinta-3)}
.abas-log{display:flex;gap:4px;border-bottom:1px solid var(--linha);flex-wrap:wrap;align-items:end;margin-bottom:14px}
.aba{border:0;border-radius:0;background:transparent;padding:9px 12px;color:var(--tinta-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.aba.sel{color:var(--tinta);border-bottom-color:var(--verde);font-weight:600}
.abas-log .sel-pc{margin-left:auto;margin-bottom:6px}
.tabela-wrap{overflow-x:auto;background:var(--folha);border:1px solid var(--linha);border-radius:12px}
.ativ-tab{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.ativ-tab th{text-align:left;font:600 11px var(--f-titulo);letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-3);padding:11px 14px;border-bottom:1px solid var(--linha);background:var(--folha-2)}
.ativ-tab td{padding:10px 14px;border-bottom:1px solid var(--linha);vertical-align:top}
.ativ-tab tr:last-child td{border-bottom:0}
.ativ-tab td .dica{white-space:nowrap}
.ativ-tab td.q{white-space:nowrap;color:var(--tinta-3);font-family:var(--f-dado);font-size:12px}
.tipo{display:inline-block;padding:4px 8px;border-radius:6px;font:600 10.5px/1 var(--f-titulo);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.t-NF_ENVIADA,.t-NF_DROPBOX{background:var(--ok-fundo);color:var(--ok)} .t-TRATATIVA{background:var(--info-fundo);color:var(--info)}
.t-EMAIL_RECEBIDO{background:var(--folha-2);color:var(--info);border:1px solid var(--info-fundo)} .t-NOVA_SOLICITACAO{background:var(--creme);color:var(--creme-tinta)}
.t-OUTLOOK_FECHADO,.t-FALHA{background:var(--erro-fundo);color:var(--erro)} .t-OUTLOOK_ABERTO,.t-ATUALIZADO,.t-NOTA_UNICA{background:var(--roxo-fundo);color:var(--roxo)}
.versao-ref{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--folha);border:1px solid var(--linha);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.versao-ref > button{margin-left:auto}
.maquinas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.maq{background:var(--folha);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;display:grid;gap:12px;align-content:start}
.maq.alerta{border-color:var(--atencao)} .maq.ruim{border-color:var(--erro)} .maq.off{opacity:.75}
.maq-cab{display:flex;justify-content:space-between;align-items:start;gap:10px}
.maq-cab b{font:600 16px var(--f-titulo)}
.maq-cab .dado{display:block;font-size:12px;color:var(--tinta-3)}
.maq dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.maq dt{color:var(--tinta-3)} .maq dd{margin:0;text-align:right;overflow-wrap:anywhere}

/* ---------- seletor de operador (rodapé da lateral) ---------- */
.op{position:relative}
.op-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;color:var(--mata-tinta);border-radius:10px;padding:6px 8px;text-align:left}
.op-btn:hover,.op.aberto .op-btn{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-titulo);color:#fff;flex:none}
.op-nome{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.op-nome small{display:block;font:400 11px var(--f-dado);color:var(--mata-suave);overflow:hidden;text-overflow:ellipsis}
.op-seta{color:var(--mata-suave);transition:transform .25s}
.op.aberto .op-seta{transform:rotate(180deg)}
.op-menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--folha);color:var(--tinta);border:1px solid var(--linha);border-radius:14px;padding:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);z-index:30;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .16s,transform .2s}
.op.aberto .op-menu{opacity:1;transform:none;pointer-events:auto}
.op-menu .rot{padding:8px 10px 6px;display:block}
.op-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;padding:8px 10px;border-radius:10px;text-align:left}
.op-item:hover{background:var(--folha-2)}
.op-item.sel{background:var(--verde-suave)}
.op-item .n{flex:1;font-size:13px}
.op-item .s{font-size:11px;color:var(--tinta-3)}
.op-item .ok{color:var(--verde);font-weight:700;opacity:0}
.op-item.sel .ok{opacity:1}

/* ---------- janelas (envio pendentes, enviar NF) ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(7,20,17,.55);display:flex;align-items:center;justify-content:center;z-index:20;animation:aparecer .15s;padding:16px}
.modal{width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--folha);border:1px solid var(--linha);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal-topo{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--linha)}
.modal-topo h3{margin:0;font:600 18px var(--f-titulo)}
.modal-topo .sub{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.modal-rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--linha);flex-wrap:wrap}
.modal-rodape .res{font-size:13px;font-weight:600}
.anel{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--linha);border-top-color:var(--creme-forte);animation:girar .8s linear infinite}
.anel.ok{animation:none;border-color:var(--ok);display:grid;place-items:center;color:var(--ok);font-weight:700}
.anel.ruim{animation:none;border-color:var(--erro);display:grid;place-items:center;color:var(--erro);font-weight:700}
.barra-prog{height:4px;background:var(--linha);overflow:hidden}
.barra-prog i{display:block;height:100%;width:30%;background:var(--creme-forte);animation:correr 1.2s ease-in-out infinite}
.barra-prog.fim i{width:100%;animation:none;background:var(--ok)}
/* robô trabalhando: etapas + registro ao vivo */
.modal.proc{width:min(900px,96vw)}
.proc-cab{background:var(--mata);color:var(--mata-tinta);padding:20px 24px;display:flex;gap:16px;align-items:center}
.proc-cab h3{margin:0;font:600 19px var(--f-titulo)}
.proc-cab .sub{font-size:13px;color:var(--mata-suave);margin-top:3px}
.proc-cab .anel{border-color:rgba(236,226,207,.18);border-top-color:var(--creme-forte)}
.proc-barra{height:6px;background:var(--mata-2)}
.proc-barra i{display:block;height:100%;width:0;background:var(--creme-forte);transition:width .4s ease}
.proc-barra.fim i{background:var(--ok)}
.proc-corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:0;flex:1;overflow:hidden}
.etapas{list-style:none;margin:0;padding:18px 24px;display:grid;gap:2px;border-right:1px solid var(--linha);overflow-y:auto;align-content:start}
.etapa{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:7px 0;color:var(--tinta-3)}
.etapa .marco{width:22px;height:22px;border-radius:50%;border:2px solid var(--linha-forte);display:grid;place-items:center;font:600 11px var(--f-dado);background:var(--folha)}
.etapa b{display:block;font-weight:600;font-size:13.5px}
.etapa small{display:block;font-size:12px;min-height:1.2em;overflow-wrap:anywhere}
.etapa.feita{color:var(--tinta-2)} .etapa.feita .marco{background:var(--verde);border-color:var(--verde);color:#fff}
.etapa.agora{color:var(--tinta)} .etapa.agora .marco{border-color:var(--verde);animation:pulso 1.1s ease-in-out infinite}
.trilha{padding:14px 18px;background:var(--folha-2);font:12px/1.6 var(--f-dado);color:var(--tinta-2);overflow-y:auto;min-height:260px}
.passo{display:grid;grid-template-columns:14px 62px 1fr;gap:8px;align-items:start;padding:2px 0;animation:entrar .25s ease both}
.passo .m{color:var(--ok);text-align:center}
.passo .h{color:var(--tinta-3)}
.passo .t{overflow-wrap:anywhere}
.passo.atual .m::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--creme-forte);animation:pulsar 1s ease-in-out infinite}
.passo.aviso .t{color:var(--atencao)} .passo.erro .t{color:var(--erro)}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes correr{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@keyframes entrar{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulsar{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pulso{50%{box-shadow:0 0 0 6px var(--verde-suave)}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
/* Enviar NF (estilo Outlook) */
.modal.compor{width:min(920px,95vw);max-height:92vh}
.compor-topo{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--mata);color:var(--mata-tinta);font-size:13px;font-weight:600}
.compor-topo .compor-quem{flex:1;font-weight:400;color:var(--mata-suave)}
.compor-topo .fechar{color:var(--mata-tinta)}
.compor-corpo{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.compor-corpo>*{flex:none}
.compor-cab{display:flex;gap:14px;align-items:stretch}
.btn-enviar{width:84px;flex:none;flex-direction:column;justify-content:center;gap:4px;border-radius:10px;background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700;font-size:13px}
.btn-enviar .ic{font-size:22px}
.btn-enviar:disabled{background:var(--folha-2);border-color:var(--linha);color:var(--tinta-3);cursor:not-allowed;opacity:1}
.campos-cab{flex:1;display:flex;flex-direction:column;min-width:0}
.linha-cab{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha);min-height:38px}
.linha-cab .rot{width:62px;flex:none}
.linha-cab input{flex:1;min-width:0;background:transparent;border:0;border-radius:0;padding:8px 2px}
.linha-cab input:focus{background:var(--folha-2)}
.campo-txt{font-size:13px;padding:8px 2px}
.campo-txt.alerta{color:var(--atencao)}
.soltar{border:2px dashed var(--linha-forte);border-radius:12px;padding:12px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.soltar:hover,.soltar.sobre{border-color:var(--creme-forte);background:var(--folha-2)}
.soltar.tem{border-style:solid}
.soltar-txt{font-size:13px;color:var(--tinta-2);text-align:center}
.soltar.tem .soltar-txt{font-size:11px}
.chips-anexo{display:flex;flex-wrap:wrap;gap:8px}
.chips-anexo:not(:empty){margin-top:8px}
.chip-anexo{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:8px;background:var(--folha-2);border:1px solid var(--linha);font-size:12px;cursor:default}
.chip-anexo .x{border:0;background:transparent;padding:0 6px;font-size:15px;color:var(--tinta-3)}
.chip-anexo .x:hover{color:var(--erro)}
.sug-linha{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sug{font-size:12px;padding:5px 10px;border-radius:999px;border-style:dashed}
.sug.forte{border-style:solid;border-color:var(--creme-forte)}
.editor{min-height:190px;background:#fff;color:#1b1b1b;border:1px solid var(--linha);border-radius:8px 8px 0 0;padding:14px 16px;font:14.5px/1.45 Calibri,"Segoe UI",sans-serif;white-space:pre-wrap;outline:none}
.editor:focus{box-shadow:inset 0 0 0 2px var(--verde)}
.editor.curto{min-height:56px}
.editor:empty::before{content:attr(data-dica);color:#8a8a8a;font-style:italic}
.assinatura{width:100%;height:120px;border:0;background:#fff;border-radius:0 0 8px 8px;margin-top:-10px;padding:0 16px 10px}
.selo-previa{background:#fff;border-radius:0 0 8px 8px;margin-top:-10px;padding:4px 16px 12px;border:1px solid var(--linha);border-top:0}
.selo-previa img{width:460px;max-width:100%;display:block}
.selos{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.selo-op{font-size:12px;padding:5px 12px;border-radius:999px}
.selo-op.sel{background:var(--creme-forte);border-color:var(--creme-forte);color:var(--mata);font-weight:700}
.compor-rodape{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--linha);min-height:44px;flex-wrap:wrap}
.compor-rodape .res{font-size:13px;font-weight:600}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--mata);color:var(--mata-tinta);padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:var(--sombra);display:none;z-index:40}
.toast.erro{background:var(--erro);color:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- janelas menores ---------- */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi.hero{grid-row:auto}}
@media (max-width:1100px){
  .app{grid-template-columns:216px minmax(0,1fr)}
  .mesa.com-leitura{grid-template-columns:1fr;grid-template-rows:minmax(0,45%) minmax(0,1fr)}
  .grade2{grid-template-columns:1fr} .contas{grid-template-columns:repeat(2,1fr)}
  .proc-corpo{grid-template-columns:1fr} .etapas{border-right:0;border-bottom:1px solid var(--linha)}
}
</style>

        <button class="ln" data-vista="log" data-log="tudo">Log completo</button>
        <button class="ln" data-vista="log" data-log="entrada">Entradas</button>
        <button class="ln" data-vista="log" data-log="saida">Saídas</button>
        <button class="ln" data-vista="log" data-log="sistema">Atualizações</button>
        <button class="ln" data-vista="maquinas" id="nav-maquinas">Máquinas</button>
      </div>
    </details>
    </nav>

    <div class="rodape">
      <button class="creme" id="btn-enviar" title="Pede ao robô (PC principal) pra enviar as solicitações pendentes às caixas dos hotéis"><svg class="ic"><use href="#i-enviar"/></svg>Enviar pendentes</button>
      <div class="op" id="op">
        <button class="op-btn" id="op-btn" aria-haspopup="listbox" aria-expanded="false" title="Operador deste PC (aparece pros outros nas ações)">
          <span class="av" id="op-av">?</span><span class="op-nome"><span id="op-nome">…</span><small id="op-pc"></small></span>
          <svg class="op-seta" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="op-menu" id="op-menu" role="listbox"></div>
      </div>
    </div>
  </aside>

  <div class="palco">
    <header class="topo">
      <div class="trilha-nav">Painel Fiscal / <b id="trilha">Caixa de entrada</b></div>
      <label class="busca"><svg class="ic"><use href="#i-busca"/></svg><input id="busca" type="search" placeholder="Buscar hóspede, e-mail, CPF/CNPJ, nº da NF, hotel…" aria-label="Buscar"></label>
      <div class="sync">
        <span class="pill" id="sync"><span class="dot" id="sync-dot"></span><span id="sync-txt">conectando…</span></span>
        <span class="pill" id="robo"><span class="dot" id="robo-dot"></span><span id="robo-txt">robô</span></span>
        <span class="pill clicavel" id="pcs" data-vista="maquinas" title="PCs da equipe"><span class="dot" id="pcs-dot"></span><span id="pcs-txt">PCs</span></span>
        <button class="btn-ic" id="btn-atualizar" title="Reler a planilha agora" aria-label="Reler a planilha agora"><svg class="ic"><use href="#i-sync"/></svg></button>
      </div>
    </header>

    <section class="vista oculta" id="v-visao"><div class="rolagem" id="visao"></div></section>
    <section class="vista oculta" id="v-hoteis">
      <div class="rolagem" id="hoteis"></div>
      <div class="detalhe" id="ficha-hotel"></div>
    </section>
    <section class="vista oculta" id="v-log"><div class="rolagem" id="log"></div></section>
    <section class="vista oculta" id="v-maquinas"><div class="rolagem" id="maquinas"></div></section>

    <section class="vista" id="v-fila">
      <div class="cabecalho">
        <h1><span id="titulo-caixa">Caixa de entrada</span> <span class="n" id="titulo-n"></span></h1>
        <div class="filtros-caixa">
          <label class="sel"><select id="f-hotel" aria-label="Hotel"></select></label>
          <label class="sel"><select id="f-agente" aria-label="Agente"></select></label>
          <label class="sel"><select id="dias" aria-label="Período">
            <option value="7">Últimos 7 dias</option><option value="15">Últimos 15 dias</option><option value="45" selected>Últimos 45 dias</option>
            <option value="90">Últimos 90 dias</option><option value="0">Todo o período</option></select></label>
          <label class="sel"><select id="f-envio" aria-label="E-mail ao hotel"></select></label>
          <button class="chip-f" data-chip="na_fila" aria-pressed="false"><span class="bola" style="background:var(--atencao)"></span>NF não emitida</button>
          <button class="chip-f" data-chip="concluida" aria-pressed="false"><span class="bola" style="background:var(--ok)"></span>NF emitida</button>
          <button class="chip-f" data-chip="tratativa" aria-pressed="false"><span class="bola" style="background:var(--info)"></span>Tratativa</button>
          <div class="seg" role="group" aria-label="Origem" id="seg-origem"></div>
        </div>
      </div>
      <div class="mesa" id="mesa">
        <section class="quadro" aria-label="Solicitações e e-mails">
          <div class="linhas-cab"><span class="col-tipo">Origem</span><span>Hóspede / assunto</span><span class="col-hotel">Hotel</span><span>Chegou</span><span>Situação</span></div>
          <div class="linhas" id="lista" role="listbox" aria-label="Itens"></div>
          <div class="paginacao"><span id="pag-txt"></span><div class="pags" id="pags"></div></div>
        </section>
        <article class="leitura oculta" id="detalhe" aria-live="polite"></article>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
const NOMES = {aguardando_envio:"Aguardando envio", na_fila:"NF não emitida", em_tratamento:"Em tratamento",
               tratativa:"Tratativa", nf_parcial:"NF parcial", concluida:"NF emitida", sem_resposta:"Sem resposta"};
const COR_SIT = {na_fila:"var(--atencao)", em_tratamento:"var(--roxo)", tratativa:"var(--info)", nf_parcial:"var(--creme-forte)",
                 aguardando_envio:"var(--tinta-3)", sem_resposta:"var(--erro)", concluida:"var(--ok)"};
// Notas fiscais (lateral): "Em aberto" = tudo que ainda não tem NF + e-mails sem resposta
const SITUACOES = [["aberto", "Em aberto"], ["na_fila"], ["em_tratamento"], ["tratativa"], ["nf_parcial"], ["aguardando_envio"],
                   ["sem_resposta"], ["concluida"], ["minhas", "Minhas"], ["todas", "Todas"]];
const ORIGENS = [["tudo", "Tudo"], ["email", "E-mail"], ["form", "Formulário"]];
const ENVIO = {todos: ["E-mail ao hotel: todos", () => true], sim: ["E-mail ao hotel: enviado", s => s.enviado],
               nao: ["E-mail ao hotel: não enviado", s => !s.enviado]};
const POR_PAGINA = 100;
let st = {fila:[], agente:"", status:{}, emails:[], hoteis:[], pcs:[]}, timer = null, intervalo = 15;
let filtro = "aberto", origem = "tudo", hotel = "", agenteF = "", envio = "todos", pagina = 0, sel = null, emailSel = null;
let AG = {}, TODOS = [];   // hotel -> agente (Cadastro_Hoteis) · formulários + e-mails num formato só
try { const p = JSON.parse(localStorage.getItem("painel.caixa") || "{}");
      if (p.origem) origem = p.origem; if (p.filtro) filtro = p.filtro; if (p.agente) agenteF = p.agente; } catch (e) {}
const guardarCaixa = () => { try { localStorage.setItem("painel.caixa", JSON.stringify({origem, filtro, agente: agenteF})); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataBr = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
const quando = iso => { if(!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };
const hojeIsoF = () => new Date().toLocaleDateString("sv-SE");
const ontemIso = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toLocaleDateString("sv-SE"); };
function horaDoCarimbo(c) { const m = String(c || "").match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, "0") + ":" + m[2] : ""; }
function chegou(iso) {   // "10:31" hoje · "Ontem" · "05/10"
  if (!iso) return "";
  const d = iso.slice(0, 10);
  return d === hojeIsoF() ? (iso.slice(11, 16) || "Hoje") : d === ontemIso() ? "Ontem" : d.slice(8, 10) + "/" + d.slice(5, 7);
}

async function api(path, corpo){
  const r = await fetch(path, {method: corpo ? "POST" : "GET", headers:{"X-Token":TOKEN,"Content-Type":"application/json"},
                               body: corpo ? JSON.stringify(corpo) : undefined});
  const j = await r.json().catch(() => ({ok:false, motivo:"resposta inválida"}));
  if (!r.ok && j.ok === undefined) j.ok = false;
  return j;
}
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast" + (erro ? " erro" : ""); t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", erro ? 5000 : 2500); }

// Cabeçalho: PCs da equipe — Outlook fechado ou conferente parado em algum PC acende o aviso
function desenharPcsCabecalho(pcs) {
  const on = pcs.filter(p => p.online);
  const fechados = on.filter(p => p.outlook === "fechado"), parados = on.filter(p => p.conferencia_atrasada);
  const nome = p => p.agente || p.pc;
  let txt = `${on.length} de ${pcs.length} PCs no ar`, cls = "on";
  if (fechados.length) { txt = "Outlook fechado: " + fechados.map(nome).join(", "); cls = "off"; }
  else if (parados.length) { txt = "conferência parada: " + parados.map(nome).join(", "); cls = "warn"; }
  else if (on.length < pcs.length) cls = "warn";
  $("pcs-dot").className = "dot " + cls; $("pcs-txt").textContent = txt;
  $("pcs").title = pcs.map(p => `${nome(p)} (${p.pc}): ${p.online ? "online" : "desligado"} · Outlook ${p.outlook || "?"} · versão ${p.versao || "?"}`).join("\n");
  const alertas = on.filter(p => p.outlook === "fechado" || p.conferencia_atrasada).length + pcs.filter(p => !p.online).length;
  $("nav-maquinas").innerHTML = (alertas ? `<span class="bola" style="background:var(--atencao)"></span>` : "") + "Máquinas" +
    `<span class="n">${alertas ? alertas + (alertas === 1 ? " alerta" : " alertas") : on.length + " no ar"}</span>`;
}

async function carregar(){
  try {
    const j = await api("/api/estado?dias=" + $("dias").value);
    if (j.erro === "não autorizado") { location.reload(); return; }   // servidor reiniciado (atualização): pega a sessão nova
    const roboAntes = JSON.stringify(st.status || {});
    st = {...st, ...j}; intervalo = j.atualizar_segundos || 15;
    if (roboAntes !== JSON.stringify(st.status || {}) && pn.vista === "visao" && pn.dados) desenharVisao();
    desenharOperador(j.agente, j.operadores || [], j.pc);
    if (!j.atualizado_em && !j.erro) {   // primeira leitura da planilha ainda em andamento
      $("sync-txt").textContent = "lendo a planilha…"; $("lista").innerHTML = `<div class="vazio">Carregando solicitações…</div>`;
      clearTimeout(timer); timer = setTimeout(carregar, 2000); return;
    }
    const ok = !j.erro;
    $("sync-dot").className = "dot " + (ok ? "on" : "off");
    $("sync-txt").textContent = ok ? "Central sincronizada " + quando(j.atualizado_em).slice(-5) : "sem conexão com a planilha";
    const s = j.status || {};
    $("robo-dot").className = "dot " + (s.ligado ? "on" : "off");
    $("robo-txt").textContent = "robô " + (s.ligado ? "ligado" : "desligado") + (s.comando ? " · " + s.comando.toLowerCase() : "");
    $("robo").title = (s.resumo || "") + (s.resposta ? "\n" + s.resposta : "");
    desenharPcsCabecalho(j.pcs || []);
    try { const em = await api("/api/emails"); if (em.emails) { st.emails = em.emails; st.este_pc = em.este_pc; } } catch(e) {}
    AG = {}; (st.hoteis || []).forEach(h => AG[h.hotel] = h.agente);
    TODOS = st.fila.map(s => ({tipo: "form", id: s.chave, s, hoteis: [s.hotel], quando: s.data + "T" + horaDoCarimbo(s.carimbo)}))
      .concat(st.emails.map(m => ({tipo: "email", id: m.id, m, hoteis: m.hotel.split(" / "), quando: m.recebido || ""})))
      .sort((a, b) => b.quando.localeCompare(a.quando));
    desenhar();
  } catch(e) {
    $("sync-dot").className = "dot off"; $("sync-txt").textContent = "app desconectado";
  }
  clearTimeout(timer); timer = setTimeout(carregar, intervalo * 1000);
}

function agentesDo(it) {
  const a = it.hoteis.map(h => AG[h]).filter(Boolean);
  return a.length ? a : it.tipo === "email" ? [it.m.agente_pc] : [];
}
function passaSit(it, f) {
  if (f === "todas") return true;
  if (it.tipo === "email") return f === "aberto" || f === "sem_resposta";
  const s = it.s;
  if (f === "aberto") return s.situacao !== "concluida";
  if (f === "minhas") return s.dono === st.agente && s.situacao !== "concluida";
  return s.situacao === f;
}
function textoDo(it) {
  if (!it._t) it._t = (it.tipo === "form"
    ? [it.s.nome, it.s.email, it.s.hotel, it.s.carimbo, it.s.nfs.join(" "), it.s.dono, ...it.s.campos.map(c => c[1])]
    : [it.m.nome, it.m.de, it.m.assunto, it.m.hotel, it.m.texto]).join(" ").toLowerCase();
  return it._t;
}
function passa(it, ignorar, busca) {
  if (ignorar !== "origem" && origem !== "tudo" && it.tipo !== origem) return false;
  if (ignorar !== "sit" && !passaSit(it, filtro)) return false;
  if (ignorar !== "agente" && agenteF && !agentesDo(it).includes(agenteF)) return false;
  if (ignorar !== "hotel" && hotel && !it.hoteis.includes(hotel)) return false;
  if (it.tipo === "form" && !ENVIO[envio][1](it.s)) return false;
  if (busca && !textoDo(it).includes(busca)) return false;
  return true;
}
const ln = (attrs, rotulo, n, atual, bola) =>
  `<button class="ln ${n === 0 ? "vazio-n" : ""}" ${attrs} aria-current="${atual}">${bola ? `<span class="bola" style="background:${bola}"></span>` : ""}${esc(rotulo)}${n !== "" ? `<span class="n">${n.toLocaleString("pt-BR")}</span>` : ""}</button>`;

// Nota dividida: quantas das partes já têm NF ("Dividida em quantas vezes"; sem número = 2)
function tagDivisao(s) {
  const partes = Math.max(s.partes || 1, 2), feitas = s.nfs.length, falta = partes - feitas;
  if (!feitas) return "";
  return feitas >= partes ? `<span class="tag nf-ok" title="NF ${esc(s.nfs.join(", "))}">NF emitida</span>`
    : `<span class="tag nf-parc" title="NF ${esc(s.nfs.join(", "))} · ${feitas} de ${partes}">falta ${falta} nota${falta > 1 ? "s" : ""}</span>`;
}
// O hóspede pediu dividida e depois aceitou uma nota só: a frase dele fica no título
const tagNotaUnica = s => s.nota_unica ? `<span class="tag nf-ok" title="${esc(s.nota_unica)}">1 nota a pedido do hóspede</span>` : "";

function desenharLateral(busca) {
  const naCaixa = typeof pn === "undefined" || pn.vista === "fila";
  const conta = (ign, f) => TODOS.reduce((n, it) => n + (passa(it, ign, busca) && f(it) ? 1 : 0), 0);
  $("nav-caixa").innerHTML = ORIGENS.map(([o]) => ln(`data-origem="${o}"`,
    o === "tudo" ? "Tudo" : o === "form" ? "Formulário (QR code)" : "E-mails dos hóspedes",
    conta("origem", it => o === "tudo" || it.tipo === o), naCaixa && origem === o)).join("");
  $("nav-nf").innerHTML = SITUACOES.map(([f, nome]) => {
    const n = conta("sit", it => passaSit(it, f));
    if (!n && f !== filtro && ["em_tratamento", "aguardando_envio", "minhas"].includes(f)) return "";
    return ln(`data-f="${f}"`, nome || NOMES[f], n, naCaixa && filtro === f, COR_SIT[f]);
  }).join("");
  const agentes = [...new Set((st.hoteis || []).map(h => h.agente).filter(Boolean))];
  $("nav-agentes").innerHTML = ln('data-agente=""', "Todos os agentes", "", naCaixa && !agenteF) +
    agentes.map(a => ln(`data-agente="${esc(a)}"`, a, conta("agente", it => agentesDo(it).includes(a)), naCaixa && agenteF === a)).join("");
}

function desenharFiltros(busca) {
  // hotéis agrupados por agente; o número é o que aparece na lista com os outros filtros
  const n = {};
  TODOS.forEach(it => { if (passa(it, "hotel", busca)) it.hoteis.forEach(h => n[h] = (n[h] || 0) + 1); });
  const grupos = {};
  (st.hoteis || []).forEach(h => { if (!agenteF || h.agente === agenteF) (grupos[h.agente || "Sem agente"] ||= []).push(h.hotel); });
  Object.keys(n).filter(h => !(h in AG) && !agenteF).forEach(h => (grupos["Fora do cadastro"] ||= []).push(h));
  const total = Object.values(grupos).reduce((a, g) => a + g.length, 0);
  $("f-hotel").innerHTML = `<option value="">Todos os hotéis (${total})</option>` +
    Object.entries(grupos).map(([a, hs]) => `<optgroup label="${esc(a)}">${hs.sort((x, y) => x.localeCompare(y, "pt")).map(h =>
      `<option value="${esc(h)}" ${h === hotel ? "selected" : ""}>${esc(h)}${n[h] ? " · " + n[h] : ""}</option>`).join("")}</optgroup>`).join("");
  const agentes = [...new Set((st.hoteis || []).map(h => h.agente).filter(Boolean))];
  $("f-agente").innerHTML = `<option value="">Todos os agentes</option>` +
    agentes.map(a => `<option ${a === agenteF ? "selected" : ""}>${esc(a)}</option>`).join("");
  $("f-envio").innerHTML = Object.entries(ENVIO).map(([k, [nome]]) => `<option value="${k}" ${k === envio ? "selected" : ""}>${nome}</option>`).join("");
  document.querySelectorAll("[data-chip]").forEach(b => b.setAttribute("aria-pressed", String(filtro === b.dataset.chip)));
  const nOrig = o => TODOS.reduce((c, it) => c + (passa(it, "origem", busca) && (o === "tudo" || it.tipo === o) ? 1 : 0), 0);
  $("seg-origem").innerHTML = ORIGENS.map(([o, nome]) =>
    `<button data-origem="${o}" aria-pressed="${origem === o}">${nome} <span class="n">${nOrig(o).toLocaleString("pt-BR")}</span></button>`).join("");
}

function linhaHtml(it) {
  if (it.tipo === "form") {
    const s = it.s;
    const sub = [s.email, s.nfs.length ? "NF " + s.nfs.join(", ") : ""].filter(Boolean).join(" · ");
    return `<div class="linha ${sel === s.chave ? "sel" : ""}" role="option" tabindex="0" data-k="${esc(s.chave)}">
      <span class="col-tipo tipo-o form"><i><svg><use href="#i-form"/></svg></i>Form.</span>
      <span class="quem-linha"><b>${esc(s.nome)}${s.dono ? `<span class="tag dono">${esc(s.dono)}</span>` : ""}${s.dividida ? '<span class="tag">dividida</span>' + tagDivisao(s) : tagNotaUnica(s)}</b>
        <small>${esc(sub)}</small></span>
      <span class="col-hotel">${esc(s.hotel)}<small>${esc(AG[s.hotel] || "")}</small></span>
      <span class="hora">${chegou(it.quando)}</span>
      <span><span class="pilula p-${s.situacao}">${NOMES[s.situacao]}</span></span></div>`;
  }
  const m = it.m;
  return `<div class="linha ${emailSel === m.id ? "sel" : ""}" role="option" tabindex="0" data-em="${esc(m.id)}">
    <span class="col-tipo tipo-o email"><i><svg><use href="#i-mail"/></svg></i>E-mail</span>
    <span class="quem-linha"><b>${esc(m.nome || m.de)}${m.anexos.length ? `<span class="tag">${m.anexos.length} anexo${m.anexos.length > 1 ? "s" : ""}</span>` : ""}${m.solicitacao ? '<span class="tag nf-ok">tem pedido</span>' : ""}</b>
      <small>${esc(m.assunto || "(sem assunto)")}</small></span>
    <span class="col-hotel">${esc(m.hotel)}<small>${m.pc_online ? "PC de " + esc(m.agente_pc || m.pc) : '<span class="erro-txt">PC desligado</span>'}</small></span>
    <span class="hora">${chegou(it.quando)}</span>
    <span><span class="pilula p-sem_resposta">Sem resposta</span></span></div>`;
}

function desenhar(){
  const busca = $("busca").value.trim().toLowerCase();
  desenharLateral(busca);
  desenharFiltros(busca);
  const lista = TODOS.filter(it => passa(it, "", busca));
  const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  pagina = Math.min(pagina, paginas - 1);
  const nomeSit = (SITUACOES.find(x => x[0] === filtro) || [])[1] || NOMES[filtro];
  $("titulo-caixa").textContent = filtro === "aberto" ? "Caixa de entrada" : nomeSit;
  $("titulo-n").textContent = `· ${lista.length.toLocaleString("pt-BR")} ${lista.length === 1 ? "item" : "itens"}`;
  $("lista").innerHTML = lista.length ? lista.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA).map(linhaHtml).join("")
    : `<div class="vazio">Nada com esses filtros.<br>Troque a situação, o hotel ou a origem.</div>`;
  const de = lista.length ? pagina * POR_PAGINA + 1 : 0, ate = Math.min(lista.length, (pagina + 1) * POR_PAGINA);
  $("pag-txt").textContent = `Mostrando ${de.toLocaleString("pt-BR")}–${ate.toLocaleString("pt-BR")} de ${lista.length.toLocaleString("pt-BR")} · ` +
    (hotel || (agenteF ? "hotéis de " + agenteF : "todos os hotéis"));
  // páginas: primeira, vizinhas da atual e última
  const nums = [...new Set([0, pagina - 1, pagina, pagina + 1, paginas - 1])].filter(p => p >= 0 && p < paginas).sort((a, b) => a - b);
  $("pags").innerHTML = paginas < 2 ? "" : nums.map((p, i) => (i && p - nums[i - 1] > 1 ? `<span style="align-self:center">…</span>` : "") +
    `<button data-pag="${p}" aria-current="${p === pagina}">${p + 1}</button>`).join("");
  desenharDetalhe();
}

function desenharDetalhe() {
  const s = sel && st.fila.find(x => x.chave === sel), e = emailSel && st.emails.find(x => x.id === emailSel);
  $("mesa").classList.toggle("com-leitura", !!(s || e));
  $("detalhe").classList.toggle("oculta", !(s || e));
  if (e) return desenharDetalheEmail(e);
  if (!s) { $("detalhe").innerHTML = ""; return; }
  // não redesenha enquanto alguém digita no painel de leitura (a lista atualiza sozinha a cada 15 s)
  const foco = document.activeElement;
  if (foco && $("detalhe").contains(foco) && /INPUT|TEXTAREA/.test(foco.tagName) && $("detalhe").dataset.k === s.chave) return;
  $("detalhe").dataset.k = s.chave;
  const meu = s.dono === st.agente, livre = !s.dono;
  const hist = s.historico.slice().reverse();
  $("detalhe").innerHTML = `
    <div class="acoes">
      <button class="prim" data-envnf="${esc(s.chave)}"><svg class="ic"><use href="#i-enviar"/></svg>Enviar NF</button>
      ${livre ? `<button data-a="ASSUMIR"><svg class="ic"><use href="#i-mao"/></svg>Assumir</button>` : ""}
      ${meu ? `<button data-a="LIBERAR">Liberar</button>` : ""}
      ${!livre && !meu ? `<button class="perigo" data-a="LIBERAR" data-v="forcar" title="Tira de ${esc(s.dono)}">Liberar à força</button>` : ""}
      <button data-copiar="1"><svg class="ic"><use href="#i-copiar"/></svg>Copiar dados</button>
      <button data-a="DIVIDIDA" data-v="${s.dividida ? "nao" : "sim"}">${s.dividida ? "Não é dividida" : "Nota dividida"}</button>
      <button class="fechar" id="d-fechar" aria-label="Fechar leitura">×</button></div>
    <header class="cab-msg"><h2>${esc(s.nome)}</h2>
      <div class="remet"><div class="avatar">${esc((s.nome || "?").trim().charAt(0).toUpperCase())}</div><b>Solicitação pelo formulário · ${esc(s.hotel)}</b>
        <span class="quando">${esc(s.carimbo)}<br><span class="dado">linha ${s.linha}</span></span>
        <span class="de">&lt;${esc(s.email)}&gt;</span></div>
      <div class="etiquetas"><span class="pilula p-${s.situacao}">${NOMES[s.situacao]}${s.nfs.length ? " · NF " + esc(s.nfs.join(", ")) : ""}</span>
        <span class="etq">Formulário (QR code)</span><span class="etq">${esc(s.hotel)}${AG[s.hotel] ? " · " + esc(AG[s.hotel]) : ""}</span>
        <span class="etq ${s.enviado ? "" : "ruim"}">${s.enviado ? "E-mail ao hotel enviado" : "E-mail ao hotel não enviado"}</span>
        ${s.dono ? `<span class="etq">Com ${esc(s.dono)} desde ${quando(s.dono_desde)}</span>` : ""}
        ${s.dividida ? tagDivisao(s) : tagNotaUnica(s)}</div></header>
    <div class="corpo-msg">
      <section class="ficha"><div class="ficha-tit"><span class="rot">Ficha do formulário</span><span class="dica">${dataBr(s.data)}</span></div>
        <dl><dt>E-mail do hóspede</dt><dd>${esc(s.email)}</dd>${s.campos.map(c =>
          `<dt>${esc(c[0])}</dt><dd class="${/\d{3}[.\/-]\d/.test(c[1]) ? "dado" : ""}">${esc(c[1])}</dd>`).join("")}</dl></section>
      <section class="ficha"><div class="ficha-tit"><span class="rot">Nota fiscal ${s.partes > 1 || s.dividida ? `· dividida em ${Math.max(s.partes, 2)}` : ""}</span></div>
        <div class="ficha-corpo">
          ${s.nfs.length ? `<div class="etiquetas">${s.nfs.map(n => `<span class="nf-num">NF ${esc(n)}${s.nfs_conferente.includes(n) ? " · conferente"
            : ` <a href="#" data-desfaz="${esc(n)}" title="Desfazer">×</a>`}</span>`).join("")}</div>` : `<span class="dica">Nenhuma NF ainda.</span>`}
          <div class="linha-form"><input id="d-nf" placeholder="Número da NF emitida" inputmode="numeric"><button class="prim" id="d-nf-ok">Marcar NF</button></div>
        </div></section>
      <section class="ficha"><div class="ficha-tit"><span class="rot">Tratativa / observação</span></div>
        <div class="ficha-corpo"><textarea id="d-txt" placeholder="Ex.: pedi o CNPJ correto por e-mail"></textarea>
          <div class="linha-form" style="justify-content:flex-end"><button data-txt="OBS">Anotar</button><button class="creme" data-txt="TRATATIVA">Registrar tratativa</button></div></div></section>
      <section><div class="rot" style="margin-bottom:10px">Histórico</div>
        ${hist.length ? `<div class="historico">${hist.map(h => `<div class="passo-h"><span class="dado">${quando(h.quando)}</span><b>${esc(h.agente)}</b> ${esc(rotulo(h))}</div>`).join("")}</div>`
          : `<span class="dica">Sem ações ainda.</span>`}</section>
    </div>`;
}

function desenharDetalheEmail(e) {
  $("detalhe").dataset.k = "";
  $("detalhe").innerHTML = `
    <div class="acoes">
      <button class="prim" data-resp-nf="${esc(e.id)}"><svg class="ic"><use href="#i-enviar"/></svg>Responder com a NF</button>
      <button data-resp="${esc(e.id)}"><svg class="ic"><use href="#i-resp"/></svg>Responder</button>
      ${e.solicitacao ? `<button data-ver-pedido="${esc(e.solicitacao.chave)}">Ver pedido do formulário (${dataBr(e.solicitacao.data)})</button>` : ""}
      <button class="fechar" id="d-fechar" aria-label="Fechar leitura">×</button></div>
    <header class="cab-msg"><h2>${esc(e.assunto || "(sem assunto)")}</h2>
      <div class="remet"><div class="avatar">${esc((e.nome || e.de || "?").trim().charAt(0).toUpperCase())}</div><b>${esc(e.nome || e.de)}</b>
        <span class="quando">${chegou(e.recebido) === "Ontem" ? "Ontem" : dataBr(e.recebido.slice(0, 10))}<br><span class="dado">${esc(e.recebido.slice(11, 16))}</span></span>
        <span class="de">&lt;${esc(e.de)}&gt; para ${esc(e.caixa)}</span></div>
      <div class="etiquetas"><span class="pilula p-sem_resposta">Sem resposta</span><span class="etq">E-mail direto</span>
        <span class="etq">${esc(e.hotel)}</span><span class="etq ${e.pc_online ? "" : "ruim"}">Caixa no PC de ${esc(e.agente_pc || e.pc)}${e.pc_online ? "" : " · desligado: a resposta sai quando ele ligar"}</span></div></header>
    <div class="corpo-msg"><div class="texto-email">${esc(e.texto || "(sem texto)")}</div>
      ${e.anexos.length ? `<div><div class="rot" style="margin-bottom:8px">Anexos</div><div class="anexos">${e.anexos.map(a =>
        `<div class="anexo"><span class="ext">${esc(String(a).split(".").pop().toUpperCase().slice(0, 4))}</span><span>${esc(a)}</span></div>`).join("")}</div></div>` : ""}
    </div>`;
}

function rotulo(h){
  const m = {ASSUMIR:"assumiu", LIBERAR: h.valor === "forcar" ? "liberou à força" : "liberou", NF:"marcou NF " + h.valor,
             DESFAZER_NF:"desfez NF " + h.valor, TRATATIVA:"tratativa: " + h.valor, OBS:"anotou: " + h.valor,
             DIVIDIDA: h.valor === "sim" ? "marcou nota dividida" : "tirou nota dividida"};
  return m[h.acao] || h.acao;
}

async function acao(a, valor){
  const s = st.fila.find(x => x.chave === sel); if (!s) return;
  document.querySelectorAll("#detalhe button").forEach(b => b.disabled = true);
  const r = await api("/api/acao", {chave: s.chave, acao: a, valor: valor || ""});
  if (r.ok) toast("Feito ✔"); else toast(r.motivo || "Não deu certo", true);
  $("detalhe").dataset.k = "";
  await carregar();
}

const irPraCaixa = () => { if (pn.vista !== "fila") trocarVista("fila"); };
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-f],[data-origem],[data-agente],[data-chip],[data-pag],[data-k],[data-em],[data-a],[data-txt],[data-desfaz],[data-copiar],[data-resp],[data-resp-nf],[data-ver-pedido],#d-fechar,#d-nf-ok");
  if (!t) return;
  const d = t.dataset;
  if (d.f) { filtro = d.f; pagina = 0; guardarCaixa(); irPraCaixa(); return desenhar(); }
  if (d.chip) { filtro = filtro === d.chip ? "aberto" : d.chip; pagina = 0; guardarCaixa(); return desenhar(); }
  if (d.origem) { origem = d.origem; pagina = 0; guardarCaixa(); irPraCaixa(); return desenhar(); }
  if (d.agente !== undefined) { agenteF = d.agente; hotel = ""; pagina = 0; guardarCaixa(); irPraCaixa(); return desenhar(); }
  if (d.pag) { pagina = Number(d.pag); desenhar(); $("lista").scrollTop = 0; return; }
  if (d.k) { sel = d.k; emailSel = null; return desenhar(); }
  if (d.em) { emailSel = d.em; sel = null; return desenhar(); }
  if (t.id === "d-fechar") { sel = null; emailSel = null; return desenhar(); }
  if (d.resp) return abrirEnvioNF(null, { id: d.resp, comNF: false });
  if (d.respNf) return abrirEnvioNF(null, { id: d.respNf, comNF: true });
  if (d.verPedido) { filtro = "todas"; origem = "tudo"; sel = d.verPedido; emailSel = null; return desenhar(); }
  if (d.a) {
    if (d.v === "forcar" && !confirm("Tirar esta solicitação de quem está tratando?")) return;
    return acao(d.a, d.v);
  }
  if (t.id === "d-nf-ok") { const n = $("d-nf").value.trim().replace(/\D/g, ""); if (!n) return toast("Digite o número da NF", true); return acao("NF", n); }
  if (d.desfaz) { e.preventDefault(); if (confirm("Desfazer a NF " + d.desfaz + "?")) return acao("DESFAZER_NF", d.desfaz); return; }
  if (d.txt) { const v = $("d-txt").value.trim(); if (!v) return toast("Escreva o texto primeiro", true); return acao(d.txt, v); }
  if (d.copiar) {
    const s = st.fila.find(x => x.chave === sel);
    try { await navigator.clipboard.writeText([`Hotel: ${s.hotel}`, `E-mail: ${s.email}`, ...s.campos.map(c => `${c[0]}: ${c[1]}`)].join("\n")); toast("Dados copiados"); }
    catch (err) { toast("Não consegui copiar", true); }
  }
});
document.addEventListener("keydown", e => {
  const l = e.target.closest?.(".linha");
  if (l && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); l.click(); }
});
$("busca").addEventListener("input", () => { pagina = 0; irPraCaixa(); desenhar(); });
$("f-hotel").addEventListener("change", e => { hotel = e.target.value; pagina = 0; desenhar(); });
$("f-agente").addEventListener("change", e => { agenteF = e.target.value; hotel = ""; pagina = 0; guardarCaixa(); desenhar(); });
$("f-envio").addEventListener("change", e => { envio = e.target.value; pagina = 0; desenhar(); });
$("dias").addEventListener("change", () => { pagina = 0; carregar(); });

// Seções da lateral abrem/fecham; o estado fica guardado neste PC
const GRUPOS_KEY = "painel.secoesFechadas";
let gruposFechados = [];
try { gruposFechados = JSON.parse(localStorage.getItem(GRUPOS_KEY) || "[]"); } catch (e) {}
document.querySelectorAll(".secao").forEach(g => {
  if (gruposFechados.includes(g.dataset.g)) g.open = false;
  else if (gruposFechados.includes("+" + g.dataset.g)) g.open = true;
  g.addEventListener("toggle", () => {
    gruposFechados = [...document.querySelectorAll(".secao")].map(x => x.open ? "+" + x.dataset.g : x.dataset.g);
    try { localStorage.setItem(GRUPOS_KEY, JSON.stringify(gruposFechados)); } catch (e) {}
  });
});
$("btn-atualizar").addEventListener("click", async () => { $("sync-txt").textContent = "atualizando…"; await api("/api/atualizar", {}); carregar(); });
$("btn-enviar").addEventListener("click", () => abrirEnvio());
// Seletor de operador: avatar com cor fixa por pessoa
const COR_OP = {"João": "#3987e5", "Cristian": "#d95926", "Clara": "#199e70", "Bernardo": "#9085e9"};
const corOp = n => COR_OP[n] || "#5f7a73";
const inicial = n => (n || "?").trim().charAt(0).toUpperCase();
let opAtual = "", opLista = [];
function desenharOperador(atual, lista, pc) {
  $("op-pc").textContent = pc || "";
  if (atual === opAtual && lista.join() === opLista.join()) return;
  opAtual = atual; opLista = lista.includes(atual) ? lista : [atual, ...lista];
  $("op-nome").textContent = atual;
  $("op-av").textContent = inicial(atual);
  $("op-av").style.background = corOp(atual);
  $("op-menu").innerHTML = `<span class="rot">Quem está neste PC</span>` + opLista.map(o =>
    `<button class="op-item ${o === atual ? "sel" : ""}" role="option" data-op="${esc(o)}">
      <span class="av" style="background:${corOp(o)}">${esc(inicial(o))}</span>
      <span class="n">${esc(o)}${o === atual ? '<br><span class="s">este PC</span>' : ""}</span><span class="ok">✓</span></button>`).join("");
}
function menuOperador(abrir) {
  const op = $("op"), aberto = abrir ?? !op.classList.contains("aberto");
  op.classList.toggle("aberto", aberto);
  $("op-btn").setAttribute("aria-expanded", aberto);
}
$("op-btn").addEventListener("click", e => { e.stopPropagation(); menuOperador(); });
$("op-menu").addEventListener("click", async e => {
  const item = e.target.closest("[data-op]");
  if (!item) return;
  e.stopPropagation();
  const nome = item.dataset.op;
  menuOperador(false);
  if (nome === opAtual) return;
  const r = await api("/api/agente", {nome});
  if (r.ok) { desenharOperador(nome, opLista); toast("Operador: " + nome); carregar(); } else toast(r.motivo, true);
});
document.addEventListener("click", e => { if (!e.target.closest("#op")) menuOperador(false); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  menuOperador(false);
  if (!document.querySelector(".modal-fundo") && (sel || emailSel)) { sel = null; emailSel = null; desenhar(); }
});
</script>
<script src="/graficos.js"></script>
<script src="/painel.js"></script>
<script>carregar();</script>
</body>
</html>
