<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentes do Smith</title>
<style>
/* Layout: janela do Painel (menu de ícones + cartões #242424) com a aba nova; barra de cima só da prévia. */
:root {
  --bg: #1f1f1f; --rail: #191919; --card: #242424; --canvas: #1c1c1c; --dot: #303030;
  --node: #282828; --node-line: #3d3d3d; --node-hover: #313131; --tile: #353535;
  --text: #f0f0f0; --text2: #d0d0d0; --muted: #a8a8a8; --accent: #479ef5; --accent-t: #6cb8f6;
  --line: #333333; --panel: #242424; --sel: #3a3a3a; --sel-line: #6b6b6b; --frame: rgba(255,255,255,.04);
  --f-p: #5aa9ff; --f-m: #ffb454; --f-n: #b69cff; --f-c: #ff7ab6; --f-g: #9aa8ba; --f-ge: #46d3e6; --f-mt: #ff6b6b;
  --t1: #9aa8ba; --t2: #6f9bff; --t3: #e6b25c; --t4: #a98bf0; --t5: #46d3e6; --t6: #9aa8ba; --t7: #ff7ab6;
  --note: #3b3321; --note-line: #6e5c2b; --note-text: #f2dfaa; --shadow: 0 4px 12px rgba(0,0,0,.35);
  --ok-bg: #16324d; --ok-fg: #8cc8fa; --at-bg: #3d3212; --at-fg: #f2c76b; --pa-bg: #3a2326; --pa-fg: #ff8d95; --of-bg: #333333; --of-fg: #b4b4b4;
  --bar: #0f0f0f; --bar-line: #2c2c2c;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f3; --rail: #ececec; --card: #ffffff; --canvas: #f6f7f9; --dot: #d6d9de;
    --node: #ffffff; --node-line: #cfd3d9; --node-hover: #f4f6f9; --tile: #eceff3;
    --text: #1f1f1f; --text2: #3a3a3a; --muted: #616161; --accent: #0f6cbd; --accent-t: #0f6cbd;
    --line: #dcdcdc; --panel: #ffffff; --sel: #e4e8ee; --sel-line: #9aa3b0; --frame: rgba(0,0,0,.03);
    --f-p: #1a62cc; --f-m: #b36a00; --f-n: #6f47d1; --f-c: #c4256f; --f-g: #5c6b80; --f-ge: #0a7f95; --f-mt: #c22f2f;
    --t1: #5c6b80; --t2: #2f62d0; --t3: #a8680a; --t4: #6f47d1; --t5: #0a7f95; --t6: #5c6b80; --t7: #c4256f;
    --note: #fff4cc; --note-line: #d9bd5a; --note-text: #4a3b0c; --shadow: 0 3px 10px rgba(30,40,60,.12);
    --ok-bg: #dcebfb; --ok-fg: #0b4a8f; --at-bg: #fbeec2; --at-fg: #6b4e00; --pa-bg: #fde0e3; --pa-fg: #9c1c28; --of-bg: #e6e6e6; --of-fg: #555555;
    --bar: #dedede; --bar-line: #c8c8c8; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f3f3; --rail: #ececec; --card: #ffffff; --canvas: #f6f7f9; --dot: #d6d9de;
  --node: #ffffff; --node-line: #cfd3d9; --node-hover: #f4f6f9; --tile: #eceff3;
  --text: #1f1f1f; --text2: #3a3a3a; --muted: #616161; --accent: #0f6cbd; --accent-t: #0f6cbd;
  --line: #dcdcdc; --panel: #ffffff; --sel: #e4e8ee; --sel-line: #9aa3b0; --frame: rgba(0,0,0,.03);
  --f-p: #1a62cc; --f-m: #b36a00; --f-n: #6f47d1; --f-c: #c4256f; --f-g: #5c6b80; --f-ge: #0a7f95; --f-mt: #c22f2f;
  --t1: #5c6b80; --t2: #2f62d0; --t3: #a8680a; --t4: #6f47d1; --t5: #0a7f95; --t6: #5c6b80; --t7: #c4256f;
  --note: #fff4cc; --note-line: #d9bd5a; --note-text: #4a3b0c; --shadow: 0 3px 10px rgba(30,40,60,.12);
  --ok-bg: #dcebfb; --ok-fg: #0b4a8f; --at-bg: #fbeec2; --at-fg: #6b4e00; --pa-bg: #fde0e3; --pa-fg: #9c1c28; --of-bg: #e6e6e6; --of-fg: #555555;
  --bar: #dedede; --bar-line: #c8c8c8; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1f1f1f; --rail: #191919; --card: #242424; --canvas: #1c1c1c; --dot: #303030;
  --node: #282828; --node-line: #3d3d3d; --node-hover: #313131; --tile: #353535;
  --text: #f0f0f0; --text2: #d0d0d0; --muted: #a8a8a8; --accent: #479ef5; --accent-t: #6cb8f6;
  --line: #333333; --panel: #242424; --sel: #3a3a3a; --sel-line: #6b6b6b; --frame: rgba(255,255,255,.04);
  --f-p: #5aa9ff; --f-m: #ffb454; --f-n: #b69cff; --f-c: #ff7ab6; --f-g: #9aa8ba; --f-ge: #46d3e6; --f-mt: #ff6b6b;
  --t1: #9aa8ba; --t2: #6f9bff; --t3: #e6b25c; --t4: #a98bf0; --t5: #46d3e6; --t6: #9aa8ba; --t7: #ff7ab6;
  --note: #3b3321; --note-line: #6e5c2b; --note-text: #f2dfaa; --shadow: 0 4px 12px rgba(0,0,0,.35);
  --ok-bg: #16324d; --ok-fg: #8cc8fa; --at-bg: #3d3212; --at-fg: #f2c76b; --pa-bg: #3a2326; --pa-fg: #ff8d95; --of-bg: #333333; --of-fg: #b4b4b4;
  --bar: #0f0f0f; --bar-line: #2c2c2c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barra só da prévia */
.pv { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 16px; background: var(--bar); border-bottom: 1px solid var(--bar-line); font-size: 12.5px; }
.pv b { font-weight: 600; }
.pv .grp { display: flex; align-items: center; gap: 6px; }
.pv .grp > span { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--card); border: 0; padding: 5px 11px; cursor: pointer; font-size: 12.5px; color: var(--text2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: #173b63; color: #fff; }
:root[data-theme="light"] .seg button[aria-pressed="true"], :root:not([data-theme="dark"]) .seg button[aria-pressed="true"] { }
.pv .dica-pv { margin-left: auto; color: var(--muted); }

/* agentes: painel flutuante minimalista sobre o mapa */
.ag { position: absolute; left: 12px; top: 62px; bottom: 64px; z-index: 6; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
.ag > * { pointer-events: auto; }
.ag:not(.aberto) .ag-lista { display: none; }
.ag .ag-dock { display: none; }   /* em espera: só o botão; os agentes aparecem ao clicar nele */
.ag:not(.aberto) .ag-bt .lb { display: none; }
.ag-bt { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; font-size: 12.5px; box-shadow: var(--shadow); }
.ag-bt:hover { border-color: var(--sel-line); }
.ag-bt .g, .ag-l .g { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
.ag-bt svg, .ag-l svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.g.ok { color: var(--ok-fg); } .g.atencao { color: var(--at-fg); } .g.parado { color: var(--pa-fg); } .g.desligado { color: var(--of-fg); }
.ag-bt .cv { transition: transform .2s; width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 2; }
.ag-bt[aria-expanded="true"] .cv { transform: rotate(180deg); }
.ag-lista { background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; width: 250px; max-height: 100%; min-height: 0; overflow-y: auto; }
.ag-l { display: flex; align-items: flex-start; gap: 8px; width: 100%; border: 0; background: transparent; border-radius: 5px; padding: 5px 8px; cursor: pointer; text-align: left; font-size: 12.5px; color: var(--text2); }
.ag-l .g { margin-top: 1px; }
.ag-l:hover, .ag-l.on { background: var(--sel); color: var(--text); }
.ag-l .t { display: flex; flex-direction: column; min-width: 0; }
.ag-l small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.em { display: grid; place-items: center; line-height: 1; }
.em svg { fill: none; }
.ag-l .em { width: 20px; flex: none; margin-top: 0; color: var(--text2); }
.ag-l .em svg { width: 17px; height: 17px; }
.ag-l:hover .em, .ag-l.on .em { color: var(--text); }
.ag-l .g { margin-left: auto; }
.ag-dock { display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 6px; flex: 0 1 auto; min-height: 0; max-height: 100%; }
.dk { position: relative; width: 38px; height: 38px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text2); cursor: pointer; box-shadow: var(--shadow); opacity: .95; padding: 0; transition: opacity .15s, border-color .15s, transform .15s; }
.dk .em svg { width: 20px; height: 20px; }
.dk:hover, .dk:focus-visible, .dk.on { opacity: 1; color: var(--text); border-color: var(--accent); transform: translateX(2px); }
.dk.on { background: var(--sel); }
.dk .s { position: absolute; right: -5px; top: -5px; width: 15px; height: 15px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--canvas); }
.dk .s svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.dk .s.atencao { background: var(--at-bg); color: var(--at-fg); border-radius: 5px; } .dk .s.parado { background: var(--pa-bg); color: var(--pa-fg); border-radius: 4px; animation: pisca 1.6s ease-in-out infinite; }
@keyframes pisca { 50% { opacity: .45; } }
.dk::after { content: attr(data-tip); position: absolute; left: 46px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--card); color: var(--text); border: 1px solid var(--sel-line); border-radius: 6px; padding: 4px 9px; font-size: 12px; font-family: var(--sans); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 7; }
.dk:hover::after, .dk:focus-visible::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .dk, .dk .s.parado { animation: none; transition: none; } }
/* janela do Painel */
.win { display: grid; grid-template-columns: auto 1fr; height: calc(100% - 44px); min-height: 640px; }
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; width: 56px; transition: width .22s ease; overflow: hidden; }
.rail.aberto { width: 232px; }
.logo { width: 30px; height: 30px; border-radius: 6px; background: #0f6cbd; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; margin: 2px 3px 12px; flex: none; }
.rot { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; white-space: nowrap; display: none; }
.rail.aberto .rot { display: block; }
.sep { height: 1px; background: var(--line); margin: 8px 6px; }
.rail.aberto .sep { display: none; }
.it { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--text2); white-space: nowrap; text-align: left; position: relative; }
.it:hover { background: var(--sel); }
.it svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.it span { display: none; font-size: 13.5px; }
.rail.aberto .it span { display: inline; }
.it.on { background: var(--sel); color: var(--text); box-shadow: inset 0 0 0 1px var(--sel-line); }
.it.on::before { content: ""; position: absolute; left: -8px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
.it .nu { margin-left: auto; font-size: 11px; background: #c4314b; color: #fff; border-radius: 9px; padding: 1px 6px; }
.rail:not(.aberto) .it .nu { display: none; }
.fim { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.ava { width: 32px; height: 32px; border-radius: 50%; background: #555; color: #fff; display: grid; place-items: center; font-size: 12px; margin: 6px 2px; flex: none; }

.principal { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topo { display: flex; justify-content: flex-end; padding: 10px 20px 0; }
.busca { display: flex; align-items: center; gap: 8px; width: min(340px, 100%); height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); font-size: 13px; }
.busca svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.pag { padding: 6px 24px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.cab { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.cab h1 { margin: 0; font-size: 22px; font-weight: 600; }
.cab p { margin: 0; color: var(--muted); font-size: 13px; }
.cab .ao { margin-left: auto; color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.cab .ao i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: bate 2s ease-in-out infinite; }
@keyframes bate { 50% { opacity: .35; } }

.faixa { display: none; border: 1px solid; border-radius: 8px; padding: 10px 14px; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.faixa.on { display: flex; }
.faixa.vermelha { background: var(--pa-bg); color: var(--pa-fg); border-color: color-mix(in srgb, var(--pa-fg) 40%, transparent); }
.faixa.ambar { background: var(--at-bg); color: var(--at-fg); border-color: color-mix(in srgb, var(--at-fg) 40%, transparent); }
.faixa b { font-weight: 600; }
.faixa button { background: transparent; border: 1px solid currentColor; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; }
.faixa button:hover { background: rgba(255,255,255,.08); }

.kps { display: flex; flex-wrap: wrap; gap: 8px; }
.kp { display: inline-flex; align-items: baseline; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; }
.kp small { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kp strong { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kp strong em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 400; }
.kp.at strong { color: var(--at-fg); } .kp.pa strong { color: var(--pa-fg); }

.grade { display: flex; flex-direction: column; flex: 1; min-height: 480px; }
.cartao.mapa { flex: 1; position: relative; }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.cartao > header { display: flex; flex-wrap: nowrap; gap: 8px 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.cartao h2 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.zoom button { white-space: nowrap; }
.cartao .sub { color: var(--muted); font-size: 12.5px; }
.chips { display: flex; gap: 5px; flex-wrap: nowrap; margin-left: auto; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--text2); }
.chip i { width: 14px; height: 3px; border-radius: 2px; background: var(--c, var(--muted)); display: block; }
.chip:hover { border-color: var(--sel-line); }
.chip[aria-pressed="true"] { background: #173b63; color: #fff; border-color: #173b63; }
.zoom { display: flex; gap: 4px; }
.zoom button { background: var(--card); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; padding: 4px 10px; font-size: 12.5px; min-width: 30px; }
.zoom button:hover { background: var(--sel); }
.cartao .stage { flex: 1; min-height: 0; }

.lista .rolagem { overflow-y: auto; min-height: 0; flex: 1; }
.tb { width: 100%; border-collapse: collapse; }
.tb th { position: sticky; top: 0; background: var(--card); text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 7px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.tb td { padding: 6px 14px; line-height: 1.3; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
.tb tr.l { cursor: pointer; }
.tb tr.l:hover td { background: var(--sel); }
.tb tr.l.on td { background: var(--sel); box-shadow: inset 0 1px 0 var(--sel-line), inset 0 -1px 0 var(--sel-line); }
.tb td small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; line-height: 1.3; }
.tb td small:empty { display: none; }
.tb td:nth-child(2) { white-space: nowrap; }
.tb td { vertical-align: middle; }
.tb .nome { font-weight: 600; }
.pil { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pil svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pil.ok { background: var(--ok-bg); color: var(--ok-fg); } .pil.atencao { background: var(--at-bg); color: var(--at-fg); }
.pil.parado { background: var(--pa-bg); color: var(--pa-fg); } .pil.desligado { background: var(--of-bg); color: var(--of-fg); }
.rod { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-top: 1px solid var(--line); background: var(--rail); font-size: 12px; color: var(--muted); }
.rod .sel-ro { margin-left: auto; }
.st { position: absolute; right: -8px; top: -8px; width: 22px; height: 22px; transform: scale(clamp(1, calc(1 / var(--z, 1)), 2.8)); transform-origin: 100% 0; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--canvas); z-index: 3; }
.st svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.st.ok { background: var(--ok-bg); color: var(--ok-fg); } .st.atencao { background: var(--at-bg); color: var(--at-fg); border-radius: 6px; }
.st.parado { background: var(--pa-bg); color: var(--pa-fg); border-radius: 4px; } .st.desligado { background: var(--of-bg); color: var(--of-fg); }
.agora-pc { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
.agora-pc small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
@media (max-width: 1180px) { .ag { max-width: 230px; } }
@media (max-width: 760px) { .win { grid-template-columns: 1fr; } .rail { display: none; } }
@media (prefers-reduced-motion: reduce) { .cab .ao i { animation: none; } .rail { transition: none; } }

/* área de trabalho */
.stage { position: relative; overflow: hidden; background-color: var(--canvas); touch-action: none; cursor: grab; min-height: 0; }
.stage.pan { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 6000px; height: 5000px; transform-origin: 0 0; }
.world.anim { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.frame {
  position: absolute; border: 1px dashed color-mix(in srgb, var(--t) 38%, transparent); background: color-mix(in srgb, var(--t) 7%, transparent); border-radius: 14px; pointer-events: none;
}
.frame b {
  position: absolute; left: 18px; top: 14px; font-weight: 600; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: color-mix(in srgb, var(--t) 70%, var(--text));
}
svg.edges { position: absolute; left: 0; top: 0; width: 6000px; height: 5000px; overflow: visible; pointer-events: none; }
.base { fill: none; stroke: var(--c); stroke-width: 1.8; opacity: .26; }
.flow { display: none; fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1 12; opacity: .55; animation: corre 1.2s linear infinite; }
@keyframes corre { to { stroke-dashoffset: -14; } }
.edge.dim { display: none; }
.edge.dim .base { opacity: .05; }
.edge.ap { display: none; }
.edge.ap.hot { display: inline; }
.edge.ap .base { stroke-dasharray: 4 5; stroke-width: 1.5; opacity: .75; }

.edge.hot .flow { display: inline; stroke-width: 4; }
.lbl {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 13px; padding: 3px 9px; border-radius: 11px;
  background: var(--node); border: 1px solid var(--c); color: var(--text); pointer-events: none; display: none;
}
.world.zoomed .lbl { display: block; }
.lbl.dim { opacity: .15; }
.world:not(.zoomed) .lbl.show { display: block; }
.node {
  position: absolute; width: 240px; height: 92px; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start;
  padding: 10px 11px; background: var(--node); border: 1px solid var(--node-line); border-radius: 10px; box-shadow: var(--shadow);
  cursor: pointer; text-align: left;
}
.node:hover { background: var(--node-hover); border-color: var(--accent); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

.world.movendo .lbl, .world.movendo .pk { display: none; }
.tile { width: 44px; height: 44px; border-radius: 10px; background: var(--tile); display: grid; place-items: center; margin-top: 12px; }

.txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.nota {
  position: absolute; width: 270px; padding: 12px 14px; background: var(--note); border: 1px solid var(--note-line); color: var(--note-text);
  border-radius: 4px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45;
}
.nota b { display: block; margin-bottom: 4px; font-size: 13px; }

/* menus flutuantes */
.zonas {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100% - 24px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; z-index: 5;

  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; color: var(--muted); font-size: 12px; background: var(--panel);

.painel header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.fechar { margin-left: auto; background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; flex: none; }
.corpo { overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }

.mono { font-family: var(--mono); font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .painel { top: auto; width: 100%; height: 62%; border-left: 0; border-top: 1px solid var(--line); transform: translateY(105%); border-radius: 12px 12px 0 0; }

}
@media (prefers-reduced-motion: reduce) {

}

html, body { height: 100%; }

    if (side === "r") return { x: n.x + W, y: n.y + H / 2 + off, dx: 1, dy: 0 };
    if (side === "l") return { x: n.x, y: n.y + H / 2 + off, dx: -1, dy: 0 };
    if (side === "t") return { x: n.x + W / 2 + off, y: n.y, dx: 0, dy: -1 };
    return { x: n.x + W / 2 + off, y: n.y + H, dx: 0, dy: 1 };
  }
  var usedPorts = {};
  var edges = [];
  E.forEach(function (e, i) {
    var a = byId[e[0]], b = byId[e[1]], fs = e[4] || "r", ts = e[5] || "l";
    var p0 = port(a, fs, e[6]), p1 = port(b, ts, e[7]);
    var dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    var k = fs === ts ? 50 : Math.max(50, Math.min(dist * 0.45, 230));
    var d = "M" + p0.x + " " + p0.y + " C" + (p0.x + p0.dx * k) + " " + (p0.y + p0.dy * k) + " " + (p1.x + p1.dx * k) + " " + (p1.y + p1.dy * k) + " " + p1.x + " " + p1.y;
    var g = svg("g", { class: "edge", style: "--c:" + colorOf(e[2]) });
    var base = svg("path", { d: d, class: "base", "marker-end": "url(#seta-" + e[2] + "-end)" });
    if (e[8]) base.setAttribute("marker-start", "url(#seta-" + e[2] + "-start)");
    var flow = svg("path", { d: d, class: "flow" });
    g.appendChild(base); g.appendChild(flow); edgesEl.appendChild(g);
    if (!REDUZ && e[2] !== "ap") {   // pacotes de dados andando no sentido da seta
      var comp = base.getTotalLength(), qtd = 1;
      for (var j = 0; j < qtd; j++) {
        var pk = svg("circle", { r: "5", class: "pk" });
        var am = svg("animateMotion", { dur: (comp / 95) + "s", repeatCount: "indefinite", begin: "-" + (j * comp / 95 / qtd) + "s", path: d });
        pk.appendChild(am); g.appendChild(pk);
      }
    }
    var ed = { i: i, from: e[0], to: e[1], f: e[2], text: e[3], g: g };
    if (e[3]) {
      var mid = base.getPointAtLength(base.getTotalLength() / 2);
      var l = document.createElement("div"); l.className = "lbl"; l.textContent = e[3];
      l.style.left = mid.x + "px"; l.style.top = mid.y + "px"; l.style.setProperty("--c", colorOf(e[2]));
      labelsEl.appendChild(l); ed.lbl = l;
    }
    edges.push(ed);
    if (!e[6] && !e[7]) { usedPorts[e[0] + ":" + fs] = [a, fs]; usedPorts[e[1] + ":" + ts] = [b, ts]; }
  });
  Object.keys(usedPorts).forEach(function (key) {
    var n = usedPorts[key][0], s = usedPorts[key][1], p = document.createElement("i"); p.className = "port";
    if (s === "r") p.style.cssText = "right:-6px;top:" + (H / 2 - 5) + "px";
    if (s === "l") p.style.cssText = "left:-6px;top:" + (H / 2 - 5) + "px";
    if (s === "t") p.style.cssText = "top:-6px;left:" + (W / 2 - 5) + "px";
    if (s === "b") p.style.cssText = "bottom:-6px;left:" + (W / 2 - 5) + "px";
    n.el.appendChild(p);
  });

  /* ---------------------------------------------------------------- zoom e movimento */
  var tx = 0, ty = 0, sc = 1, MIN = 0.08, MAX = 2.2;
  var fimMov = 0;
  function aplicar() {
    world.classList.add("movendo"); clearTimeout(fimMov); fimMov = setTimeout(function () { world.classList.remove("movendo"); }, 180);
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")";
    world.classList.toggle("zoomed", sc >= 0.5); world.style.setProperty("--z", sc);
    var s = 26 * sc;
    stage.style.backgroundImage = "radial-gradient(circle, var(--dot) " + Math.max(1, 1.3 * sc) + "px, transparent " + (Math.max(1, 1.3 * sc) + 0.5) + "px)";
    stage.style.backgroundSize = s + "px " + s + "px";
    stage.style.backgroundPosition = tx + "px " + ty + "px";
  }
  function espacoUtil() {
    var r = stage.getBoundingClientRect();
    var comPainel = painel.classList.contains("on") && window.innerWidth > 760;
    return { w: r.width - (comPainel ? 360 : 0), h: r.height - (window.innerWidth <= 760 && painel.classList.contains("on") ? r.height * 0.62 : 0) };
  }
  function animar(fn) {
    var reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduz) { world.classList.add("anim"); setTimeout(function () { world.classList.remove("anim"); }, 480); }
    fn();
  }
  var ultimoAlvo = null;
  function enquadrar(box, margem) {
    ultimoAlvo = box;
    var u = espacoUtil(), m = margem == null ? 40 : margem;
    var s = Math.min((u.w - m * 2) / box.w, (u.h - m * 2 - 50) / box.h);
    sc = Math.max(MIN, Math.min(MAX, s));
    tx = (u.w - box.w * sc) / 2 - box.x * sc;
    ty = (u.h - box.h * sc) / 2 - box.y * sc + 10;
    aplicar();
  }
  var TUDO = { x: 20, y: 10, w: MAXX + 60, h: MAXY + 60 };
  var primeira = true;
  function verTudo() { var alvo = primeira ? PRIN : TUDO; primeira = false; animar(function () { enquadrar(alvo, 16); }); }
  function zoomEm(cx, cy, fator) {
    var ns = Math.max(MIN, Math.min(MAX, sc * fator)); fator = ns / sc;
    tx = cx - (cx - tx) * fator; ty = cy - (cy - ty) * fator; sc = ns; aplicar();
  }
  $("zmais").onclick = function () { var u = espacoUtil(); animar(function () { zoomEm(u.w / 2, u.h / 2, 1.3); }); };
  $("zmenos").onclick = function () { var u = espacoUtil(); animar(function () { zoomEm(u.w / 2, u.h / 2, 1 / 1.3); }); };
  $("zfit").onclick = verTudo;

  stage.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomEm(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0016)));
  }, { passive: false });

  var ptrs = {}, arrastou = false, ult = null, pinca = null, alvoClique = null;
  stage.addEventListener("pointerdown", function (ev) {
    if (ev.target.closest(".zonas, .painel, .dica")) return;
    ptrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    alvoClique = ev.target.closest(".node");
    arrastou = false; ult = { x: ev.clientX, y: ev.clientY };
    var ids = Object.keys(ptrs);
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinca = Math.hypot(a.x - b.x, a.y - b.y); arrastou = true; }
    try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* sem captura */ }
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!ptrs[ev.pointerId]) return;
    ptrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    var ids = Object.keys(ptrs);
    if (ids.length === 2 && pinca) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y), r = stage.getBoundingClientRect();
      zoomEm((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinca); pinca = d; return;
    }
    var dx = ev.clientX - ult.x, dy = ev.clientY - ult.y;
    if (!arrastou && Math.hypot(dx, dy) < 5) return;
    if (!arrastou) { arrastou = true; stage.classList.add("pan"); }
    tx += dx; ty += dy; ult = { x: ev.clientX, y: ev.clientY }; aplicar();
  });
  function soltar(ev) {
    if (!ptrs[ev.pointerId]) return;
    delete ptrs[ev.pointerId]; pinca = null; stage.classList.remove("pan");
    if (!arrastou && alvoClique && ev.type === "pointerup") escolher(alvoClique.id.slice(2));
    else if (!arrastou && !alvoClique && ev.type === "pointerup" && !ev.target.closest(".zonas, .painel, .dica")) limpar();
    alvoClique = null;
  }
  stage.addEventListener("pointerup", soltar);
  stage.addEventListener("pointercancel", soltar);

  /* ---------------------------------------------------------------- escolha e destaque */
  var selecionado = null, caminho = "prod";
  function atualizar() {
    var ativas = {}, nosAtivos = {}, filtro = !!(selecionado || caminho);
    edges.forEach(function (e) {
      var on = selecionado ? (e.from === selecionado || e.to === selecionado) : (caminho ? (caminho === "prod" ? !!PRODSET[e.from + ">" + e.to] : e.f === caminho) : false);
      ativas[e.i] = on; if (on) { nosAtivos[e.from] = 1; nosAtivos[e.to] = 1; }
    });
    if (selecionado) nosAtivos[selecionado] = 1;
    edges.forEach(function (e) {
      e.g.classList.toggle("hot", !!ativas[e.i]);
      e.g.classList.toggle("dim", filtro && !ativas[e.i]);
      if (e.lbl) { e.lbl.classList.toggle("show", !!ativas[e.i]); e.lbl.classList.toggle("dim", filtro && !ativas[e.i]); }
    });
    N.forEach(function (n) {
      n.el.classList.toggle("sel", n.id === selecionado);
      n.el.classList.toggle("dim", filtro && !nosAtivos[n.id]);
    });
    document.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", String((c.dataset.f || "") === (caminho || ""))); });
  }
  function limpar() { selecionado = null; painel.classList.remove("on"); stage.classList.remove("com-painel"); atualizar(); if (window.aoEscolherNo) window.aoEscolherNo(null); }

  function centralizar(n) {
    var u = espacoUtil();
    animar(function () { tx = u.w / 2 - (n.x + W / 2) * sc; ty = u.h / 2 - (n.y + H / 2) * sc; aplicar(); });
  }

  function escolher(id) {
    var n = byId[id]; if (!n) return;
    selecionado = id;
    painel.classList.add("on"); stage.classList.add("com-painel");
    desenharPainel(n); atualizar(); if (window.aoEscolherNo) window.aoEscolherNo(id);
    if (sc < 0.7) { sc = 0.9; aplicar(); }
    centralizar(n);
  }

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function desenharPainel(n) {
    painel.textContent = "";
    var h = el("header");
    var tile = el("div", "tile"); tile.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n.icon] + "</svg>";
    var box = el("div"); var h2 = el("h2", null, n.t); var p = el("p", null, n.kind + " · " + n.s); box.appendChild(h2); box.appendChild(p);
    var x = el("button", "fechar", "×"); x.setAttribute("aria-label", "Fechar detalhes"); x.onclick = limpar;
    h.appendChild(tile); h.appendChild(box); h.appendChild(x); painel.appendChild(h);
    var c = el("div", "corpo");
    function sec(titulo, filho) { var s = el("section"); s.appendChild(el("h3", null, titulo)); s.appendChild(filho); c.appendChild(s); }
    if (window.AGORA_NO) window.AGORA_NO(n, sec, el);
    sec("O que faz", el("p", null, n.det));
    if (n.tag) sec("Quando", el("p", null, n.tag));
    if (n.roda) sec("Onde roda", el("p", null, n.roda));
    if (n.regras && n.regras.length) { var ul = el("ul"); n.regras.forEach(function (r) { ul.appendChild(el("li", null, r)); }); sec("Regras e limites", ul); }
    if (n.code) sec("No código", el("div", "mono", n.code));
    function lista(titulo, itens, seta) {
      if (!itens.length) return;
      var l = el("div", "liga");
      itens.forEach(function (e) {
        var outro = byId[seta === "←" ? e.from : e.to];
        var b = el("button"); b.type = "button";
        var i = el("i", null, seta); i.style.setProperty("--c", colorOf(e.f));
        var t = el("span"); t.appendChild(document.createTextNode(outro.t));
        if (e.text) { var sm = el("small", null, e.text + " · " + FLOWS.filter(function (f) { return f.id === e.f; })[0].nome); t.appendChild(sm); }
        b.appendChild(i); b.appendChild(t); b.onclick = function () { escolher(outro.id); };
        l.appendChild(b);
      });
      sec(titulo, l);
    }
    lista("Recebe de", edges.filter(function (e) { return e.to === n.id; }), "←");
    lista("Entrega para", edges.filter(function (e) { return e.from === n.id; }), "→");
    painel.appendChild(c);
  }

  /* ---------------------------------------------------------------- barras */
  var chips = $("chips");
  function chip(id, nome, cor) {
    var b = el("button", "chip"); b.type = "button"; b.dataset.f = id || "";
    if (cor) { var i = el("i"); i.style.setProperty("--c", cor); b.appendChild(i); b.style.setProperty("--c", cor); }
    b.appendChild(document.createTextNode(nome));
    b.onclick = function () { caminho = (caminho === id) ? null : id; if (id === null) caminho = null; atualizar(); };
    chips.appendChild(b);
  }
  chip(null, "Tudo");
  var CURTO = { prod: "Produção", p: "Pedido", m: "E-mails e telas", n: "Nota e envio", c: "4 PCs", g: "Código e testes", ge: "Gerência", mt: "Faxina e saúde", ins: "Instalação", ap: "Quem usa quem" };
  FLOWS.forEach(function (f) { chip(f.id, CURTO[f.id] || f.nome, colorOf(f.id)); });

  var zonas = $("zonas");
  FR.forEach(function (fr) {
    if (!fr.z) return;
    var b = el("button", null, fr.z); b.type = "button";
    b.onclick = function () { animar(function () { enquadrar(fr.box, 30); }); };
    zonas.appendChild(b);
  });

  nodesEl.addEventListener("click", function (ev) {
    if (ev.detail !== 0) return;   // clique do mouse já foi tratado no pointerup; aqui só Enter e Espaço
    var b = ev.target.closest(".node"); if (b) escolher(b.id.slice(2));
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") limpar();
    else if (ev.key === "+" || ev.key === "=") $("zmais").click();
    else if (ev.key === "-") $("zmenos").click();
    else if (ev.key === "0") verTudo();
  });
  window.addEventListener("resize", function () { if (!selecionado && ultimoAlvo) enquadrar(ultimoAlvo, 16); });

  document.addEventListener("visibilitychange", function () { if (edgesEl.pauseAnimations) { if (document.hidden) edgesEl.pauseAnimations(); else edgesEl.unpauseAnimations(); } });
  window.mapaEscolher = escolher; window.mapaNos = byId;
  atualizar();
  verTudo();
  if (window.APLICAR_ESTADO) window.APLICAR_ESTADO();
})();
</script>
