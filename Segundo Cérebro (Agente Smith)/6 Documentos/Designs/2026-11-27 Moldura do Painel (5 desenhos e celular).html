<title>Desenhos da Moldura Fiscal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Conceito: mesa de comparação. A página é neutra; as janelas do Painel (escuro ou claro) são o que se olha. */
:root{--bg:#f3f4f7;--surf:#ffffff;--fg:#1a2230;--mut:#586377;--line:#dbe0e8;--acc:#0f62c9;--accfg:#ffffff;--soft:#e8f0fc;--okc:#1b6b34;--warnc:#7a5200;--mesa:#dfe3ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121519;--surf:#1a1e25;--fg:#e9edf3;--mut:#9ba6b8;--line:#2a313c;--acc:#5aa7ff;--accfg:#06121f;--soft:#16273d;--okc:#8fd19e;--warnc:#f2c76b;--mesa:#0d0f13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121519;--surf:#1a1e25;--fg:#e9edf3;--mut:#9ba6b8;--line:#2a313c;--acc:#5aa7ff;--accfg:#06121f;--soft:#16273d;--okc:#8fd19e;--warnc:#f2c76b;--mesa:#0d0f13;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.pg{max-width:1680px;margin:0 auto;display:grid;gap:22px}
.pg h1{font-size:clamp(24px,3.2vw,34px);line-height:1.12;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
.pg h2{font-size:18px;margin:0 0 10px;letter-spacing:-.005em}
.pg h3{font-size:14px;margin:0 0 6px}
.intro{color:var(--mut);max-width:80ch;margin:0}
.selo-dados{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warnc);border:1px solid currentColor;border-radius:6px;padding:3px 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.grupo-c{display:grid;gap:6px}
.grupo-c>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
.seg button{font:inherit;font-size:13.5px;font-weight:500;color:var(--fg);background:none;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button:hover{background:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg)}
.seg button:focus-visible,.cartao-d:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.designs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cartao-d{font:inherit;text-align:left;color:var(--fg);background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;min-width:0}
.cartao-d b{font-size:15px}
.cartao-d small{color:var(--mut);font-size:12.5px;line-height:1.35}
.cartao-d[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.cartao-d .cust{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.mesa{background:var(--mesa);border:1px solid var(--line);border-radius:14px;padding:16px}
.palco{width:100%}
.palco.real{overflow:auto}
.celulares{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.celulares>div{display:grid;gap:8px;justify-items:center}
.celulares figcaption{font-size:13px;color:var(--mut)}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card p{margin:0 0 8px;color:var(--mut)}
.card .lead{color:var(--fg);font-size:15.5px;margin-bottom:12px}
.tabela-pecas{display:grid;gap:0;border-top:1px solid var(--line)}
.tabela-pecas>div{display:grid;grid-template-columns:minmax(130px,.55fr) 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tabela-pecas dt{font-weight:600}
.tabela-pecas dd{margin:0;color:var(--mut)}
.heur{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.heur li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:14px}
.heur .n{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.heur b{display:block;font-size:13px}
.heur span{color:var(--mut)}
.rolagem-x{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.mx th,table.mx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mx th:first-child,table.mx td:first-child{text-align:left}
table.mx thead th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
table.mx td.p{letter-spacing:2px;font-size:13px;color:var(--acc)}
.legenda{font-size:13px;color:var(--mut);margin:8px 0 0}
.sug{border-color:var(--acc);background:var(--soft)}
.arvore{font:13px/1.7 ui-monospace,Consolas,monospace;color:var(--fg);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.perguntas{margin:0;padding-left:20px;display:grid;gap:6px}

/* ====================== A JANELA DO PAINEL (o desenho) ====================== */
.janela{container-type:inline-size;container-name:j;position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--borda);background:var(--fundo);color:var(--texto);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --fundo:#181818;--painel:#1f1f1f;--cartao:#242424;--borda:#333333;--faixa:#292929;--hover:#3a3a3a;--texto:#f0f0f0;--texto2:#d0d0d0;--apagado:#a8a8a8;
  --destaque:#479ef5;--destaque-suave:#173b63;--sel-texto:#ffffff;--assunto:#6cb8f6;--sel:#2f3a47;
  --urgente-fundo:#3a2326;--urgente-texto:#ff8d95;--urgente:#e8484f;--ok-fundo:#173b2a;--ok:#8fd19e;--aviso-fundo:#3d3212;--aviso:#f2c76b;--info-fundo:#16324d;--info:#8cc8fa;
  --vidro:rgba(34,34,40,.62);--vidro-card:rgba(31,31,31,.8);--vidro-borda:rgba(255,255,255,.14);--halo1:rgba(71,158,245,.22);--halo2:rgba(150,110,255,.14)}
.janela[data-mock="claro"]{--fundo:#eaeef3;--painel:#ffffff;--cartao:#f7f8fa;--borda:#d6dce4;--faixa:#f1f3f6;--hover:#e4e9f0;--texto:#1c2430;--texto2:#3b4656;--apagado:#586577;
  --destaque:#0f6cbd;--destaque-suave:#d7e8fa;--sel-texto:#0a3560;--assunto:#0f5aa6;--sel:#e1ebf7;
  --urgente-fundo:#fbe9ec;--urgente-texto:#a4262c;--urgente:#c4314b;--ok-fundo:#e1f3e7;--ok:#1b6b34;--aviso-fundo:#fff2cf;--aviso:#7a5200;--info-fundo:#dfecfb;--info:#0b5394;
  --vidro:rgba(255,255,255,.66);--vidro-card:rgba(255,255,255,.82);--vidro-borda:rgba(255,255,255,.95);--halo1:rgba(15,108,189,.2);--halo2:rgba(150,110,255,.14)}
.janela *{box-sizing:border-box}
:where(.janela button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.janela button:focus-visible,.janela input:focus-visible{outline:2px solid var(--destaque);outline-offset:2px}
.janela .ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.janela b{font-weight:600}
.v{width:100%;height:100%;display:grid;min-width:0;min-height:0}
.pn{background:var(--painel);border:1px solid var(--borda);border-radius:8px;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column}
.num{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--info-fundo);color:var(--info);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;flex:none}
.num.urg{background:var(--urgente);color:#fff}

/* barra lateral */
.lat{background:var(--painel);display:flex;flex-direction:column;gap:2px;min-height:0;padding:12px 10px}
.marca{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;min-width:0}
.selo{width:34px;height:34px;border-radius:9px;background:#0f6cbd;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.marca b{display:block;font-size:15px;white-space:nowrap}
.marca small{display:block;color:var(--apagado);font-size:12px;white-space:nowrap}
.nav{display:grid;gap:2px}
.grupo{display:grid;gap:2px}
.rot{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado);padding:12px 12px 4px;white-space:nowrap}
.ln{display:flex!important;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:8px;color:var(--texto2);width:100%;position:relative}
.ln:hover{background:var(--hover)}
.ln[aria-current="true"]{background:var(--destaque-suave);color:var(--sel-texto);font-weight:600}
.ln-t{flex:1;min-width:0;white-space:nowrap}
.esp{flex:1}
.env{display:flex!important;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--destaque)!important;color:var(--assunto);font-weight:600;width:100%}
.env:hover{background:var(--destaque-suave)}
.env-t{white-space:nowrap}
.op{display:flex!important;align-items:center;gap:10px;padding:6px;border-radius:10px;width:100%;min-width:0}
.op:hover{background:var(--hover)}
.av{width:34px;height:34px;border-radius:50%;background:#555;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:2px solid var(--destaque)}
.op-t{display:grid;min-width:0;line-height:1.25}
.op-t small{color:var(--apagado);font-size:12px;white-space:nowrap}
.op-t b{white-space:nowrap}
.rec{display:flex!important;align-items:center;gap:12px;height:34px;padding:0 12px;color:var(--apagado);font-size:13px;border-radius:8px;width:100%}
.rec:hover{background:var(--hover);color:var(--texto)}

/* topo, trilha, pesquisa */
.topo{display:flex;align-items:center;gap:14px;padding:0 14px;min-width:0}
.trilha{display:flex;align-items:center;gap:6px;color:var(--apagado);font-size:13px;white-space:nowrap;flex:none}
.trilha b{color:var(--texto)}
.busca{display:flex;align-items:center;gap:8px;height:38px;flex:1;min-width:0;max-width:680px;padding:0 10px 0 12px;background:var(--faixa);border:1px solid var(--borda);border-radius:8px;color:var(--apagado)}
.busca:focus-within{border-color:var(--destaque)}
.busca input{flex:1;min-width:0;background:none;border:0;color:var(--texto);font:inherit;font-size:14px;padding:0;height:100%}
.busca input::placeholder{color:var(--apagado);text-overflow:ellipsis}
.busca input:focus{outline:0}
.escopo{flex:none;font-size:12px;font-weight:600;color:var(--assunto);background:var(--destaque-suave);border-radius:6px;padding:2px 8px;white-space:nowrap}
kbd{flex:none;font:11px ui-monospace,Consolas,monospace;border:1px solid var(--borda);border-radius:4px;padding:1px 6px;color:var(--apagado);white-space:nowrap}

/* faixa de comandos */
.faixa{display:flex;align-items:center;gap:2px;padding:0 10px;min-width:0}
.cmd{display:inline-flex!important;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:7px;color:var(--texto2);white-space:nowrap;flex:none}
.cmd:hover{background:var(--hover);color:var(--texto)}
.cmd.forte{background:var(--destaque-suave);color:var(--sel-texto);font-weight:600}
.cmd.nf{background:var(--destaque);color:#fff;font-weight:600}
.cmd.nf:hover{filter:brightness(1.08);color:#fff}
.sep{width:1px;height:20px;background:var(--borda);margin:0 6px;flex:none}

/* pastas */
.pn-cab{padding:12px 14px 4px;display:flex;align-items:center;justify-content:space-between}
.rot2{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado)}
.pst{display:flex!important;align-items:center;gap:10px;width:calc(100% - 12px);margin:1px 6px;padding:7px 8px;border-radius:7px;color:var(--texto2);min-width:0}
.pst:hover{background:var(--hover)}
.pst.at-sel{background:var(--sel);color:var(--texto)}
.pst-t{display:grid;flex:1;min-width:0;line-height:1.25}
.pst-t b{white-space:nowrap}
.pst-t small{font-size:12px;color:var(--apagado);white-space:nowrap}
.pst-t small.alerta{color:var(--aviso);font-weight:600}
.sub{padding-left:22px}
.sub .pst{padding:6px 8px}
.mais{color:var(--assunto);font-size:13px;padding:6px 16px}

/* lista */
.cab-l{display:grid;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--borda)}
.abas-l{display:flex;gap:16px;align-items:center}
.abas-l button{padding:6px 0;color:var(--texto2);border-bottom:2px solid transparent}
.abas-l button[aria-pressed="true"]{color:var(--assunto);border-bottom-color:var(--destaque);font-weight:600}
.filtros-l{display:flex;gap:8px;flex-wrap:wrap}
.pil{display:inline-flex!important;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--borda);border-radius:8px;color:var(--texto2);font-size:13px;white-space:nowrap}
.pil:hover{background:var(--hover)}
.pil b{color:var(--texto)}
.pil[aria-pressed="true"]{background:var(--destaque-suave);color:var(--sel-texto);border-color:transparent}
.caixa-btn{display:none!important}
.linhas{flex:1;min-height:0;overflow:hidden}
.grp{font-size:12px;font-weight:600;color:var(--apagado);padding:7px 16px;background:var(--faixa)}
.em{display:grid!important;gap:2px;width:100%;padding:10px 14px 10px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--borda);text-align:left}
.em:hover{background:var(--hover)}
.em.sel{background:var(--sel);border-left-color:var(--destaque)}
.em.urg{background:var(--urgente-fundo)}
.em.urg .em-de,.em.urg .em-as{color:var(--urgente-texto)}
.em-l1{display:flex;justify-content:space-between;gap:8px;min-width:0}
.em-de{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em.nl .em-de{font-weight:700}
.em-d{color:var(--assunto);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.em-as{color:var(--assunto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-pv{color:var(--apagado);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--info-fundo);color:var(--info);white-space:nowrap}
.tag.urg{background:transparent;border:1px solid var(--urgente);color:var(--urgente-texto)}
.tag.ok{background:var(--ok-fundo);color:var(--ok)}
.tag.cor{background:var(--aviso-fundo);color:var(--aviso)}

/* leitura */
.leit{flex:1;min-height:0;overflow:hidden;padding:18px 26px;display:grid;gap:12px;align-content:start}
.leit h2{margin:0;font-size:20px;line-height:1.25;color:var(--texto)}
.leit .meta{color:var(--apagado);font-size:13px}
.leit p{margin:0;color:var(--texto2);max-width:68ch}
.acoes-l{display:flex;gap:2px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--borda);background:var(--faixa)}
.ficha{display:grid;gap:8px;background:var(--cartao);border:1px solid var(--borda);border-radius:8px;padding:12px 14px;max-width:560px}
.ficha-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
.ficha-g>div{min-width:0}
.ficha-g>div:nth-child(3){white-space:nowrap}
.ficha small{display:block;color:var(--apagado);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.vazio-l{display:grid;place-items:center;color:var(--apagado)}

/* rodapé de situação */
.status{display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;font-size:12.5px;color:var(--texto2)}
.st-c{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip{display:inline-flex!important;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;white-space:nowrap;flex:none;border:1px solid var(--borda)}
.chip.ok .chip-s{color:var(--ok)}
.chip.at{background:var(--aviso-fundo);border-color:transparent;color:var(--aviso);font-weight:600}
.chip-b{display:inline-grid!important;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--apagado);flex:none}
.chip-b:hover{background:var(--hover);color:var(--texto)}
.v1 .status,.v3 .status,.v4 .status{background:var(--painel);border-top:1px solid var(--borda)}

/* ---- Desenho 1: barra fixa com nomes ---- */
.v1{grid-template-columns:232px minmax(0,1fr);grid-template-rows:56px 46px minmax(0,1fr) 32px;grid-template-areas:"lat topo""lat faixa""lat corpo""st st"}
.v1 .lat{grid-area:lat;border-right:1px solid var(--borda)}
.v1 .topo{grid-area:topo}.v1 .faixa{grid-area:faixa}.v1 .status{grid-area:st}
.v1 .corpo{grid-area:corpo;display:grid;grid-template-columns:236px 372px minmax(0,1fr);gap:10px;padding:0 10px 10px;min-height:0}
/* ---- Desenho 2: trilho com nomes embaixo ---- */
.v2{grid-template-columns:78px minmax(0,1fr);grid-template-rows:62px minmax(0,1fr);grid-template-areas:"rail topo""rail corpo"}
.v2 .rail{grid-area:rail;background:var(--painel);border-right:1px solid var(--borda);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:2px;position:relative}
.v2 .rail .selo{margin:2px 0 10px}
.tr{display:grid!important;justify-items:center;gap:3px;width:66px;padding:8px 2px 7px;border-radius:10px;color:var(--texto2);position:relative;font-size:11px;line-height:1.15;text-align:center!important}
.tr span{max-width:100%}
.tr:hover{background:var(--hover)}
.tr[aria-current="true"]{background:var(--destaque-suave);color:var(--sel-texto);font-weight:600}
.tr .num{position:absolute;top:1px;right:3px;min-width:18px;height:17px;padding:0 4px;font-size:11px}
.tr.saude.at{color:var(--aviso);background:var(--aviso-fundo);font-weight:600}
.v2 .topo{grid-area:topo;gap:12px}
.v2 .titulo{font-size:18px;font-weight:600;white-space:nowrap;flex:none}
.v2 .corpo{grid-area:corpo;display:grid;grid-template-columns:232px 360px minmax(0,1fr);gap:10px;padding:0 10px 10px;min-height:0}
.pop-saude{position:absolute;left:calc(100% + 8px);bottom:8px;width:310px;z-index:5;background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:12px;display:grid;gap:8px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.pop-saude .chip{height:auto;min-height:30px;padding:5px 10px;border-radius:8px;white-space:normal;justify-content:flex-start}
/* ---- Desenho 3: agentes em abas ---- */
.v3{grid-template-columns:64px minmax(0,1fr);grid-template-rows:54px 58px 46px minmax(0,1fr) 32px;grid-template-areas:"lat topo""lat ag""lat faixa""lat corpo""st st"}
.v3.nomes{grid-template-columns:220px minmax(0,1fr)}
.v3 .lat{grid-area:lat;border-right:1px solid var(--borda);align-items:center}
.v3.nomes .lat{align-items:stretch}
.v3:not(.nomes) .lat :is(.ln-t,.rot,.env-t,.op-t,.marca div,.rec-t){display:none}
.v3:not(.nomes) .lat .ln,.v3:not(.nomes) .lat .env,.v3:not(.nomes) .lat .rec{width:44px;height:42px;padding:0;justify-content:center}
.v3:not(.nomes) .lat .env{border:0!important}
.v3:not(.nomes) .lat .grupo+.grupo{border-top:1px solid var(--borda);margin-top:4px;padding-top:4px}
.v3:not(.nomes) .lat .num{position:absolute;top:1px;right:-2px;min-width:18px;height:17px;padding:0 4px;font-size:11px}
.v3:not(.nomes) .lat .op{width:auto;padding:4px}

function Janela({v,W,H,tema,sit,nomes,paleta,sel,setSel}){
  const p={sit,sel,setSel,nomes,paleta};
  const C=W<760?CelLista:({d1:V1,d2:V2,d3:V3,d4:V4,d5:V5})[v];
  return html`<div className="janela" data-mock=${tema} style=${{width:W,height:H}}><${C} ...${p}/></div>`;
}
function Palco({W,H,real,children}){
  const ref=useRef(null); const [disp,setDisp]=useState(1200);
  useEffect(()=>{const el=ref.current; const f=()=>setDisp(el.clientWidth||1200); f(); const ro=new ResizeObserver(f); ro.observe(el); return ()=>ro.disconnect()},[]);
  const s=real?1:Math.min(1,disp/W);
  return html`<div className=${'palco'+(real?' real':'')} ref=${ref}><div style=${{width:W*s,height:H*s}}><div style=${{width:W,height:H,transform:'scale('+s+')',transformOrigin:'0 0'}}>${children}</div></div></div>`;
}
