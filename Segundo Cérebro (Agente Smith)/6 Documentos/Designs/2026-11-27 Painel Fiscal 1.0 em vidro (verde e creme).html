<title>Painel Fiscal 1.0 em Vidro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Conceito: vitrine neutra em volta; dentro, o Painel Fiscal em vidro verde e creme. Cada bloco responde a uma pergunta em português simples. */
:root{--bg:#f2f1ec;--surf:#ffffff;--fg:#1c1f1b;--mut:#5a6158;--line:#dcdcd3;--acc:#1f6b4f;--accfg:#ffffff;--soft:#e6efe8;--mesa:#e4e2d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111412;--surf:#191d1a;--fg:#e9eee8;--mut:#9eab9e;--line:#2a312c;--acc:#7fd0a6;--accfg:#08140d;--soft:#18271f;--mesa:#0b0e0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111412;--surf:#191d1a;--fg:#e9eee8;--mut:#9eab9e;--line:#2a312c;--acc:#7fd0a6;--accfg:#08140d;--soft:#18271f;--mesa:#0b0e0c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.pg{max-width:1680px;margin:0 auto;display:grid;gap:20px}
.pg h1{font-size:clamp(24px,3.2vw,34px);line-height:1.12;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
.pg h2{font-size:18px;margin:0 0 10px}
.intro{color:var(--mut);max-width:84ch;margin:0}
.selo-dados{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.grupo-c{display:grid;gap:6px}
.grupo-c>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
.seg button{font:inherit;font-size:13.5px;font-weight:500;color:var(--fg);background:none;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{background:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.amostra{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:none}
.mesa{background:var(--mesa);border:1px solid var(--line);border-radius:14px;padding:16px}
.palco{width:100%}
.palco.real{overflow:auto}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card li{color:var(--mut)}
.card ul{margin:0;padding-left:20px;display:grid;gap:7px}
.card b{color:var(--fg)}

/* ====================== O PAINEL (o desenho) ====================== */
.janela{container-type:inline-size;container-name:j;position:relative;overflow:hidden;border-radius:16px;color:var(--texto);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif;isolation:isolate;
  --cena1:#efe7d4;--cena2:#cfdcc9;--cena3:#e8d6b8;--bolha1:rgba(31,107,79,.34);--bolha2:rgba(214,178,120,.5);
  --vidro:rgba(255,255,255,.46);--vidro-forte:rgba(255,255,255,.66);--vidro-borda:rgba(255,255,255,.62);--luz:rgba(255,255,255,.7);--sombra:rgba(50,36,22,.5);
  --texto:#1a1c19;--texto2:#394037;--apagado:#545b52;--linha:rgba(40,46,36,.13);--escuro:#1f2a24;--creme:#efe3c2;--creme-esc:#b08a3e;
  --sobe:#0f6b44;--sobe-f:rgba(15,107,68,.12);--desce:#a6261d;--desce-f:rgba(166,38,29,.1);--aviso:#7a4f00;--aviso-f:rgba(214,150,30,.18);--info:#1f5f8b;--info-f:rgba(31,95,139,.12);
  --urg-fundo:rgba(166,38,29,.07);--sel:rgba(20,145,127,.12);
  --verde:#14917f;--verde-esc:#0b5d52;--verde-t:#0b6c5f}
.janela[data-mock="escuro"]{--cena1:#0d1410;--cena2:#13261c;--cena3:#2a2417;--bolha1:rgba(40,150,110,.3);--bolha2:rgba(214,178,120,.2);
  --vidro:rgba(22,30,26,.52);--vidro-forte:rgba(34,44,38,.7);--vidro-borda:rgba(255,255,255,.12);--luz:rgba(255,255,255,.12);--sombra:rgba(0,0,0,.7);
  --texto:#eef2ec;--texto2:#d2dad1;--apagado:#a3b1a3;--linha:rgba(255,255,255,.11);--escuro:#efe3c2;--creme:#efe3c2;--creme-esc:#d9b86a;
  --sobe:#86dcb0;--sobe-f:rgba(134,220,176,.14);--desce:#ffa198;--desce-f:rgba(255,161,152,.12);--aviso:#f2c76b;--aviso-f:rgba(242,199,107,.14);--info:#9cc9ef;--info-f:rgba(156,201,239,.13);
  --urg-fundo:rgba(255,161,152,.08);--sel:rgba(134,220,176,.12);--verde-t:#86dcb0}
.janela[data-tom="floresta"]{--verde:#2b7a55;--verde-esc:#163f2b}
.janela[data-tom="floresta"]:not([data-mock="escuro"]){--verde-t:#226646}
.janela[data-tom="oliva"]{--verde:#5d7f35;--verde-esc:#2f4419}
.janela[data-tom="oliva"]:not([data-mock="escuro"]){--verde-t:#4a672a}
.janela *{box-sizing:border-box}
:where(.janela button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:where(.janela input){font:inherit;color:inherit}
.janela :is(button,input):focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.janela .ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cena{position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 45% at 12% 8%,var(--cena2),transparent 70%),radial-gradient(45% 55% at 92% 25%,var(--cena3),transparent 70%),radial-gradient(70% 60% at 50% 105%,var(--cena2),transparent 70%),var(--cena1)}
.cena i{position:absolute;border-radius:50%;filter:blur(40px)}
.cena i:nth-child(1){width:34%;height:42%;left:22%;top:6%;background:var(--bolha2)}
.cena i:nth-child(2){width:30%;height:36%;right:6%;top:38%;background:var(--bolha1)}
.cena i:nth-child(3){width:26%;height:30%;left:4%;bottom:8%;background:var(--bolha1)}
.cena i:nth-child(4){width:22%;height:24%;left:48%;bottom:2%;background:var(--bolha2)}
.vidro{background:var(--vidro);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--vidro-borda);box-shadow:inset 0 1px 0 var(--luz),0 18px 40px -30px var(--sombra);border-radius:18px}
.casca{position:absolute;inset:0;display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"lat topo""lat meio""lat rod";gap:12px 16px;padding:14px 18px 12px}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0}to{opacity:1}}

/* barra lateral (a cápsula, comum às duas telas) */
.lat{grid-area:lat;align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:999px;width:58px;justify-self:center}
.selo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:linear-gradient(150deg,var(--verde),var(--verde-esc));margin-bottom:4px}
.lb{position:relative;width:42px;height:42px;border-radius:50%;display:grid!important;place-items:center;color:var(--texto2)}
.lb:hover{background:var(--vidro-forte)}
.lb[aria-current="true"]{background:#fff;color:#1b1b1b;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.lb .n{position:absolute;top:-2px;right:-4px;min-width:18px;height:17px;padding:0 4px;border-radius:9px;background:#d2402c;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.lat hr{width:22px;border:0;border-top:1px solid var(--linha);margin:2px 0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(150deg,var(--verde),var(--verde-esc));box-shadow:0 0 0 3px var(--vidro-forte);flex:none}

/* topo */
.topo{grid-area:topo;display:flex;align-items:center;gap:12px;padding:7px;border-radius:999px;min-width:0}
.quem{display:flex;align-items:center;gap:10px;flex:none;padding-right:6px}
.quem b{font-size:15px;font-weight:600;white-space:nowrap}
.busca{flex:1;min-width:0;max-width:560px;margin-left:auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 8px;border-radius:999px;background:var(--vidro-forte);border:1px solid var(--vidro-borda)}
.orbe{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,#fff,var(--creme) 30%,var(--verde) 70%,var(--verde-esc))}
.busca input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;height:100%}
.busca input::placeholder{color:var(--apagado)}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--linha);border-radius:5px;padding:1px 6px;color:var(--apagado);flex:none;white-space:nowrap}
.botao-r{position:relative;width:42px;height:42px;border-radius:50%;display:grid!important;place-items:center;background:var(--vidro-forte);border:1px solid var(--vidro-borda)!important;flex:none}
.botao-r.branco{background:#fff;color:#1b1b1b}
.ponto{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#d2402c;box-shadow:0 0 0 2px #fff}
.avisos{position:absolute;top:70px;right:22px;width:350px;z-index:30;padding:10px;display:grid;gap:6px;animation:entra .25s both}
.avisos h3{margin:4px 6px 2px;font-size:13px}
.aviso{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--vidro-forte)}
.aviso small{display:block;color:var(--apagado);font-size:12px}
.abas-ol{display:flex;gap:2px;flex:none;padding-left:6px}
.abas-ol button{height:36px;padding:0 12px;border-radius:999px;color:var(--texto2);white-space:nowrap}
.abas-ol button[aria-pressed="true"]{background:#fff;color:#1b1b1b;font-weight:600}
.caixa-de{display:inline-flex!important;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--vidro-forte);border:1px solid var(--vidro-borda)!important;white-space:nowrap;flex:none}
.caixa-de b{font-weight:600}
.caixa-de .q{font-size:12px;font-weight:700;color:var(--apagado)}

/* rodapé de situação (comum às duas telas, em linha própria) */
.rod{grid-area:rod;justify-self:center;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 14px;border-radius:999px;font-size:12.5px;color:var(--texto2);white-space:nowrap;max-width:100%}
.rod .ok{display:inline-flex;align-items:center;gap:5px;color:var(--sobe);font-weight:600}
.rod .sep{width:1px;height:16px;background:var(--linha);margin:0 4px}
.rod .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px}
.rod .ib{width:30px;height:30px;border-radius:50%;display:grid!important;place-items:center;color:var(--apagado)}
.rod .ib:hover{background:var(--vidro-forte);color:var(--texto)}

/* ---------- VISÃO GERAL ---------- */
.principal{grid-area:meio;min-height:0;overflow:auto;padding:26px 30px 30px;border-radius:26px;scrollbar-width:thin}
.titulo h2{margin:0;font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.02em}
.titulo p{margin:6px 0 20px;color:var(--apagado);max-width:72ch}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.bloco{grid-column:span 12;min-width:0;padding:20px 22px;display:grid;gap:14px;align-content:start;animation:entra .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 80ms)}
.b-linha{grid-column:span 7}.b-rosca{grid-column:span 5}.b-agentes{grid-column:span 6}.b-meta{grid-column:span 6}
.pergunta{display:grid;gap:3px}
.pergunta small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--verde-t)}
.pergunta h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.resposta{margin:0;font-size:15px;color:var(--texto2);max-width:70ch}
.resposta b{color:var(--texto)}
.como-ler{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--apagado);border-top:1px solid var(--linha);padding-top:10px;margin:0}
.como-ler .ico{margin-top:2px}
.resumo{grid-column:span 12;padding:18px 22px;display:grid;gap:14px;animation:entra .55s cubic-bezier(.2,.8,.2,1) both}
.resumo .frase{margin:0;font-size:17px;line-height:1.5;max-width:90ch}
.resumo .frase b{font-weight:600}
.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--linha);padding-top:14px}
.numero{display:grid;gap:3px;padding:0 18px;border-left:1px solid var(--linha);min-width:0;align-content:start}
.numero:first-child{border-left:0;padding-left:0}
.numero .v{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.numero .r{font-size:13px;font-weight:600}
.numero .x{font-size:12.5px;color:var(--apagado)}
.var{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap;justify-self:start}
.var.bom{background:var(--sobe-f);color:var(--sobe)}
.var.ruim{background:var(--desce-f);color:var(--desce)}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sobe);background:var(--sobe-f);padding:4px 10px;border-radius:999px;justify-self:start}
.grafico svg{width:100%;height:auto;display:block;overflow:visible}
.grafico .grade line{stroke:var(--linha)}
.grafico text{fill:var(--apagado);font-size:12px;font-family:Inter,sans-serif}
.serie{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.on .serie{stroke-dashoffset:0}
.area{opacity:0;transition:opacity .8s .5s}
.on .area{opacity:1}
.legenda{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--texto2)}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.legenda i{width:18px;height:3px;border-radius:2px}
.nota-g{font-size:12px;font-weight:600}
.rosca-w{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.b-rosca .partes li{font-size:13.5px}
.rosca{position:relative;width:150px;height:150px}
.rosca svg{transform:rotate(-90deg)}
.rosca circle{fill:none;stroke-width:18;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.rosca .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rosca .c b{font-size:28px;font-weight:600;line-height:1}
.rosca .c small{font-size:12px;color:var(--apagado)}
.partes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.partes li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:13px}
.partes i{width:10px;height:10px;border-radius:3px;margin-top:4px}
.partes b{font-weight:600}
.partes small{display:block;color:var(--apagado);font-size:12px}
.partes .p{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.barras{display:grid;gap:12px}
.barra{display:grid;gap:5px}
.barra .t{display:flex;justify-content:space-between;gap:4px 10px;font-size:13.5px;flex-wrap:wrap}
.barra .t b{font-weight:600}
.barra .t span{color:var(--apagado)}
.trilho{height:12px;border-radius:999px;background:var(--linha);overflow:hidden}
.trilho span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--verde),var(--verde-esc));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sobe)!important;font-weight:600;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.meta-g{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:center}
.anel{position:relative;width:140px;height:140px}
.anel svg{transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.anel .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.anel .c b{font-size:30px;font-weight:600;line-height:1}
.anel .c small{font-size:12px;color:var(--apagado)}
.fatos{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:13.5px}
.fatos li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;color:var(--texto2)}
.fatos b{color:var(--texto);font-weight:600}
.atencao{display:grid;gap:8px}
.at{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--vidro-forte)}
.at .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.at .ic.ruim{background:var(--desce-f);color:var(--desce)}
.at .ic.aviso{background:var(--aviso-f);color:var(--aviso)}
.at .ic.info{background:var(--info-f);color:var(--info)}
.at b{font-weight:600}
.at small{display:block;color:var(--apagado);font-size:12.5px}
.bt{display:inline-flex!important;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-weight:600;white-space:nowrap}
.bt.escuro{background:#1b1b1b;color:#fff}
.janela[data-mock="escuro"] .bt.escuro{background:#fff;color:#1b1b1b}
.bt.claro{background:var(--vidro-forte);border:1px solid var(--vidro-borda)!important}

/* ---------- CAIXA DE ENTRADA (igual à de hoje, com as cores novas) ---------- */
.ol{grid-area:meio;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
.faixa{display:flex;align-items:center;gap:2px;padding:4px 8px;border-radius:14px;min-width:0;animation:surge .4s both}
.cmd{display:inline-flex!important;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:8px;color:var(--texto2);white-space:nowrap;flex:none}
.cmd:hover{background:var(--vidro-forte);color:var(--texto)}
.cmd.contorno{border:1px solid var(--verde)!important;color:var(--verde-t);font-weight:600}
.cmd.forte{background:linear-gradient(160deg,var(--verde),var(--verde-esc));color:#fff;font-weight:600}
.faixa .sep{width:1px;height:18px;background:var(--linha);margin:0 6px;flex:none}
.faixa .esp{flex:1}
.mesa-ol{display:grid;grid-template-columns:290px 360px minmax(0,1fr);gap:10px;min-height:0}
.pn{min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;border-radius:16px;animation:entra .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.pn-cab{display:flex;align-items:center;gap:6px;padding:12px 14px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado)}
.pst{display:flex!important;align-items:center;gap:10px;width:calc(100% - 12px);margin:1px 6px;padding:8px 9px;border-radius:9px;color:var(--texto2);min-width:0}
.pst:hover{background:var(--vidro-forte)}
.pst.sel{background:var(--vidro-forte);color:var(--texto);font-weight:600;box-shadow:inset 3px 0 0 var(--verde)}
.pst-t{display:grid;flex:1;min-width:0;line-height:1.3}
.pst-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst-t small{font-size:12px;color:var(--apagado);font-weight:400;overflow-wrap:anywhere}
.qt{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--sel);color:var(--verde-t);font-size:12px;font-weight:700;display:inline-grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}

.abas-l{display:flex;gap:16px;align-items:center}

.abas-l .col{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid!important;place-items:center;border:0!important}
.filtros-l{display:flex;gap:6px;flex-wrap:wrap}
.pil{display:inline-flex!important;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--linha)!important;border-radius:999px;color:var(--texto2);font-size:12.5px;white-space:nowrap;background:var(--vidro)}
.pil b{color:var(--texto);font-weight:600}
.pil .q{color:var(--apagado);font-weight:600}
.cab-l .info{font-size:12px;color:var(--apagado)}
.cab-l .info b{color:var(--texto);font-weight:600}
.linhas{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.grp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--apagado);padding:7px 14px;background:var(--vidro)}
.em{display:grid!important;gap:2px;width:100%;padding:10px 14px 10px 12px;border-left:3px solid var(--verde)!important;border-bottom:1px solid var(--linha)!important;text-align:left;animation:entra .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.em:hover{background:var(--vidro-forte)}
.em[aria-selected="true"]{background:var(--sel)}
.em.urg{background:var(--urg-fundo);border-left-color:var(--desce)!important}
.em.urg .de,.em.urg .as{color:var(--desce)}
.em .l1{display:flex;justify-content:space-between;gap:8px;min-width:0}
.em .de{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em .d{color:var(--verde-t);font-size:12px;flex:none;font-weight:600}
.em.urg .d{color:var(--desce)}
.em .as{color:var(--verde-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.em .pv{color:var(--apagado);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em .flag{color:var(--desce);flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--info-f);color:var(--info)}
.tag.ur{background:transparent;border:1px solid var(--desce);color:var(--desce)}
.tag.ok{background:var(--sobe-f);color:var(--sobe)}
.tag.cor{background:var(--aviso-f);color:var(--aviso)}
.leit{padding:22px 26px;display:grid;gap:12px;align-content:start;overflow:auto;height:100%}

.leit h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}

.ficha-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;padding:14px;border-radius:14px;background:var(--vidro-forte)}
.ficha-p small{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado)}
.ficha-p div{min-width:0}
.ficha-p div:nth-child(3){white-space:nowrap}
.abas-cel{display:none}

/* ---- 1100 px ---- */
@container j (max-width:1279px){
  .b-linha,.b-meta{grid-column:span 12}
  .b-rosca{grid-column:span 6}.b-agentes{grid-column:span 6}
  .rosca-w{grid-template-columns:minmax(0,1fr)}
  .rosca{margin:0 auto}
  .mesa-ol{grid-template-columns:340px minmax(0,1fr)}
  .mesa-ol .pastas{display:none}
  .faixa .cmd:not(.forte):not(.contorno) .ct{display:none}
  .faixa .cmd:not(.forte):not(.contorno){width:36px;justify-content:center;padding:0}
  .abas-ol button:not([aria-pressed="true"]){display:none}
  .rod .x{display:none}
}
/* ---- celular ---- */
@container j (max-width:700px){
  .casca{grid-template-columns:minmax(0,1fr);grid-template-areas:"topo""meio""rod";padding:12px 12px 10px;gap:10px}
  .lat,.quem b,.busca kbd,.abas-ol,.caixa-de{display:none!important}
  .topo .botao-r:not(.branco){display:none!important}
  .topo{padding:6px}.busca{max-width:none;margin-left:0}
  .principal{padding:18px 14px}
  .titulo h2{font-size:26px}
  .b-linha,.b-rosca,.b-agentes,.b-meta{grid-column:span 12}
  .bloco,.resumo{padding:16px}
  .numeros{grid-template-columns:1fr 1fr;gap:14px 0}
  .numero:nth-child(3){border-left:0;padding-left:0}
  .meta-g{grid-template-columns:minmax(0,1fr)}
  .anel{margin:0 auto}
  .at{grid-template-columns:auto minmax(0,1fr)}
  .at .bt{grid-column:1 / -1}
  .ol{grid-template-rows:minmax(0,1fr)}
  .faixa{display:none}
  .mesa-ol{grid-template-columns:minmax(0,1fr)}
  .mesa-ol .leit-pn{display:none}
  .rod{display:none}
  .abas-cel{display:grid;grid-area:rod;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px}
  .abas-cel button{display:grid!important;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--texto2);min-height:52px;align-content:center;border-radius:16px;position:relative}
  .abas-cel button[aria-pressed="true"]{background:#fff;color:#1b1b1b}
  .abas-cel .n{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:16px;padding:0 4px;border-radius:8px;background:#d2402c;color:#fff;font-size:10px;display:grid;place-items:center}
  .avisos{left:12px;right:12px;width:auto;top:66px}
}

function Palco({W,H,real,children}){
  const ref=useRef(null);const [disp,setDisp]=useState(1200);
  useEffect(()=>{const el=ref.current;const f=()=>setDisp(el.clientWidth||1200);f();const ro=new ResizeObserver(f);ro.observe(el);return ()=>ro.disconnect()},[]);
  const s=real?1:Math.min(1,disp/W);
  return html`<div className=${'palco'+(real?' real':'')} ref=${ref}><div style=${{width:W*s,height:H*s,margin:'0 auto'}}><div style=${{width:W,height:H,transform:'scale('+s+')',transformOrigin:'0 0'}}>${children}</div></div></div>`;
}
function Seg({valor,set,opcoes,rot}){return html`<div className="seg" role="group" aria-label=${rot}>${opcoes.map(([v,t,cor])=>html`<button key=${String(v)} aria-pressed=${valor===v} onClick=${()=>set(v)}>${cor?html`<span className="amostra" style=${{background:cor}}></span>`:null}${t}</button>`)}</div>`}

    <p className="intro">Versão 2. A Visão geral tem menos caixinhas e mais gráficos, e cada bloco responde a uma pergunta em português simples, com a resposta escrita e um "como ler". A Caixa de entrada é a mesma de hoje, só com as cores verde e creme, o fundo de vidro e uma animação leve. Clique na barra lateral, no sino, nos e-mails e no botão de tema dentro do desenho.</p>

    <div className="grupo-c"><span>Largura</span><${Seg} rot="Largura" valor=${W} set=${v=>{setW(v);setVolta(x=>x+1)}} opcoes=${[[1440,'1440'],[1100,'1100'],[390,'Celular']]}/></div>
    <div className="grupo-c"><span>Tema</span><${Seg} rot="Tema" valor=${tema} set=${setTema} opcoes=${[['claro','Claro'],['escuro','Escuro']]}/></div>
    <div className="grupo-c"><span>Tom do verde (ajuste ao logo)</span><${Seg} rot="Tom do verde" valor=${tom} set=${setTom} opcoes=${[['agua','Verde-água','#14917f'],['floresta','Floresta','#2b7a55'],['oliva','Oliva','#5d7f35']]}/></div>
    <div className="grupo-c"><span>Animação</span><${Seg} rot="Animação" valor=${null} set=${()=>setVolta(v=>v+1)} opcoes=${[['rever','Ver de novo']]}/></div>
    <div className="grupo-c"><span>Tamanho</span><${Seg} rot="Tamanho" valor=${real} set=${setReal} opcoes=${[[false,'Caber na tela'],[true,'Tamanho real']]}/></div></div>
   <div className="mesa"><${Palco} W=${W} H=${H} real=${real}><${Janela} W=${W} H=${H} tema=${tema} setTema=${setTema} tom=${tom} tela=${tela} ir=${ir} volta=${volta} sel=${sel} setSel=${setSel}/><//></div>
   <section className="duas">
    <div className="card"><h2>Visão geral: o que mudou e por quê (Nielsen)</h2><ul>
      <li><b>Uma frase no topo</b> diz o dia inteiro em português: o que chegou, o que saiu e por onde começar. (Falar a língua de quem usa.)</li>
      <li><b>Cada bloco é uma pergunta</b> ("Vamos bater a meta?"), traz a resposta escrita antes do gráfico e termina com "como ler". Ninguém precisa interpretar sozinho. (Ver em vez de decorar; ajuda à mão.)</li>
      <li><b>Comparações em palavras</b>: "3 a mais que ontem", no lugar de "↑12%". E sempre dizem contra o quê.</li>
      <li><b>Situação sempre escrita</b> ("Tudo funcionando", "PC ligado"), nunca só pela cor. (Ver o que o sistema está fazendo.)</li>
      <li><b>"O que precisa de atenção agora"</b> tem um botão em cada item, que leva direto ao que resolver. (Evitar o erro antes dele.)</li>

      <li>Muda só a cor: o azul virou verde, o urgente continua vermelho, e o fundo é de vidro.</li>
      <li>Animação leve: as linhas entram uma depois da outra e o e-mail aparece suave ao clicar.</li>

}
